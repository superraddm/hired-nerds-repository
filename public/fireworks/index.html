<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>K-Pop BOOM! Firework Stage</title>
<meta name="description" content="Mix glowing potions, launch fireworks over a K-pop stage. A bright, simple touch game for little hands.">
<meta name="theme-color" content="#12002b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K-Pop BOOM!">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{
  --pink:#ff3fa4; --violet:#a855ff; --cyan:#33e6ff; --gold:#ffd23f; --lime:#7dff4a; --orange:#ff7a2f;
  --ink:#12002b; --panel:rgba(18,0,43,.55);
  --bs: clamp(44px, min(8dvh, 15vw), 96px);           /* bottle size: 8 per rail + label must fit the height, 2 rails must fit the width */
  --cauldron-w: min(17dvh, 24vw, 150px); --go: min(14dvh, 20vw, 124px); --clear: min(7dvh, 10vw, 64px);
  --round: clamp(44px, min(8dvh, 11vw), 72px);
  --font: "Baloo 2","Fredoka","Nunito","Varela Round",-apple-system,"Segoe UI",system-ui,sans-serif;
  --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px);
  --sal: env(safe-area-inset-left,0px); --sar: env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:#fff;font-family:var(--font);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;border:0;color:#fff;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus{outline:none}

#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- UI overlay ---------- */
#ui{position:fixed;inset:0;pointer-events:none;display:grid;overflow:hidden;
  grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "left mid right" "left ctl right";
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px);gap:6px}
#ui.hidden{display:none}
#ui > *{pointer-events:none}
#ui button{pointer-events:auto}

#top{grid-area:top;display:flex;align-items:center;gap:8px;justify-content:space-between;min-width:0}
#stars{display:flex;align-items:center;gap:3px;background:var(--panel);border-radius:999px;padding:6px 10px;min-width:0;overflow:hidden;flex:0 1 auto;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-height:44px}
#stars .slot{width:clamp(10px,min(3.2dvh,2.7vw),28px);height:clamp(10px,min(3.2dvh,2.7vw),28px);font-size:clamp(9px,min(2.8dvh,2.4vw),24px);line-height:1;flex:0 0 auto;
  display:grid;place-items:center;filter:grayscale(1) opacity(.35);transition:transform .25s, filter .25s}
#stars .slot.on{filter:none;transform:scale(1.15)}
#stars .count{font-weight:900;font-size:clamp(16px,3dvh,26px);margin-left:6px;color:var(--gold);text-shadow:0 0 10px var(--gold)}
#topbtns{display:flex;gap:clamp(4px,1.2vw,8px)}
.round{width:var(--round);height:var(--round);border-radius:50%;font-size:calc(var(--round)*.5);flex:0 0 auto;
  display:grid;place-items:center;background:linear-gradient(160deg,#4a1a86,#1f0644);
  box-shadow:0 0 0 3px rgba(255,255,255,.18) inset,0 6px 18px rgba(0,0,0,.45),0 0 18px rgba(168,85,255,.5);
  transition:transform .12s}
.round:active{transform:scale(.9)}
.round.off{filter:grayscale(1) opacity(.6)}
#finale{background:linear-gradient(160deg,#ff3fa4,#ff7a2f);box-shadow:0 0 0 3px rgba(255,255,255,.25) inset,0 6px 18px rgba(0,0,0,.45),0 0 22px #ff3fa4;
  animation:pulse 1.6s ease-in-out infinite}
#finale.busy{animation:spin 1s linear infinite}

/* ---------- shelves ---------- */
.shelf{display:grid;grid-auto-flow:row;grid-template-columns:repeat(var(--cols,1),auto);align-content:space-evenly;justify-items:center;
  gap:4px;padding:6px 4px;border-radius:22px;background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:hidden}
#left{grid-area:left;--lc:#ff3fa4}#right{grid-area:right;--lc:#a855ff}
.shelf .lbl{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;font-weight:900;
  background:var(--lc);border-radius:14px;padding:3px 6px;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.45);box-shadow:0 0 14px var(--lc),0 0 0 2px rgba(255,255,255,.35) inset;
  white-space:nowrap;max-width:100%}
.shelf .lbl i{font-style:normal;font-size:calc(var(--bs)*.3)}
.shelf .lbl b{font-size:clamp(9px,calc(var(--bs)*.17),14px);letter-spacing:.6px}
@media (orientation:landscape){
  :root{--bs: clamp(44px, min(14.5dvh, 9vw), 92px)}
  .shelf{--cols:2;align-content:center;gap:2px}
  .shelf .lbl{flex-direction:row;gap:5px;border-radius:999px;padding:3px 10px;margin-bottom:2px}
}
.bottle .n{position:absolute;top:-2px;right:-3px;z-index:3;display:none;place-items:center;min-width:1.5em;height:1.5em;padding:0 .2em;border-radius:999px;
  background:#fff;color:#1a0630;font-weight:900;font-size:calc(var(--bs)*.24);box-shadow:0 0 10px var(--c),0 2px 0 rgba(0,0,0,.3)}
.bottle.in-mix .n{display:grid}
.bottle.hint{animation:hint .45s ease-in-out 2}
#cauldron.nope{animation:nope .4s ease-in-out}

.bottle{position:relative;width:var(--bs);height:calc(var(--bs)*1.22);background:none;padding:0;display:grid;place-items:end center;
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 70%,transparent));transition:transform .15s}
.bottle:active{transform:scale(.88)}
.bottle .cork{position:absolute;top:0;left:50%;transform:translateX(-50%);width:26%;height:14%;border-radius:4px 4px 2px 2px;
  background:linear-gradient(#e2b07a,#a86f3c);z-index:2}
.bottle .neck{position:absolute;top:9%;left:50%;transform:translateX(-50%);width:32%;height:16%;
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 45%,#fff),color-mix(in srgb,var(--c) 80%,#000));border-radius:4px 4px 0 0}
.bottle .glass{position:relative;width:88%;height:78%;border-radius:38% 38% 42% 42%/30% 30% 46% 46%;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.75) 0 8%,transparent 20%),
             linear-gradient(160deg,color-mix(in srgb,var(--c) 55%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 70%,#000) 100%);
  box-shadow:0 0 0 3px rgba(255,255,255,.35) inset,0 4px 0 rgba(0,0,0,.25) inset;display:grid;place-items:center}
.bottle .icon{font-size:calc(var(--bs)*.42);line-height:1;transform:translateY(8%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.bottle .eyes{position:absolute;top:22%;left:50%;transform:translateX(-50%);display:flex;gap:18%;width:60%;justify-content:center}
.bottle .eyes i{width:22%;aspect-ratio:1;background:#fff;border-radius:50%;position:relative;overflow:hidden;animation:blink 4.5s infinite}
.bottle .eyes i::after{content:"";position:absolute;width:55%;height:55%;background:#1a0630;border-radius:50%;left:30%;top:30%}
.bottle:nth-child(2n) .eyes i{animation-delay:1.3s}.bottle:nth-child(3n) .eyes i{animation-delay:2.6s}
.bottle.in-mix .glass{box-shadow:0 0 0 4px #fff inset,0 0 0 3px rgba(255,255,255,.3),0 0 24px var(--c)}
.bottle.in-mix{animation:wiggle 1.2s ease-in-out infinite}
.bottle.pour{animation:pour .55s ease-in-out}

/* ---------- controls ---------- */
#ctl{grid-area:ctl;display:flex;align-items:flex-end;justify-content:center;gap:clamp(6px,1.5vw,22px);padding-bottom:4px;min-width:0}
#clear{width:max(44px,var(--clear));height:max(44px,var(--clear));font-size:clamp(18px,3.4dvh,30px);align-self:center;
  background:linear-gradient(160deg,#3a1866,#1a0636)}
#cauldronWrap{position:relative;display:grid;place-items:center;pointer-events:auto}
#chips{display:flex;gap:4px;min-height:clamp(26px,4.5dvh,40px);align-items:flex-end;margin-bottom:4px}
#chips span{width:clamp(26px,4.5dvh,40px);height:clamp(26px,4.5dvh,40px);border-radius:50%;background:var(--c,#fff);display:grid;place-items:center;
  font-size:clamp(14px,2.6dvh,22px);box-shadow:0 0 12px var(--c,#fff),0 0 0 2px #fff inset;animation:popin .3s cubic-bezier(.2,1.6,.4,1)}
#cauldron{width:max(84px,var(--cauldron-w));height:calc(max(84px,var(--cauldron-w))*0.85);position:relative;border-radius:14% 14% 48% 48%/12% 12% 60% 60%;
  background:linear-gradient(#3b2a52,#12061f 60%,#050010);box-shadow:0 8px 0 rgba(0,0,0,.35) inset,0 0 0 4px #2a1440 inset,0 10px 24px rgba(0,0,0,.5);
  transition:transform .1s}
#cauldron:active{transform:scale(.95)}
#cauldron .rim{position:absolute;left:-4%;right:-4%;top:-6%;height:22%;border-radius:50%;background:linear-gradient(#5c3f80,#2a1440);
  box-shadow:0 0 0 3px rgba(255,255,255,.12) inset}
#cauldron .liquid{position:absolute;left:4%;right:4%;top:0;height:16%;border-radius:50%;
  background:var(--liq,linear-gradient(90deg,#6a1ba8,#3a0a70));background-size:300% 100%;animation:swirl 3s linear infinite;
  box-shadow:0 0 22px var(--glow,#a855ff),0 0 0 2px rgba(255,255,255,.35) inset;transition:box-shadow .3s}
#cauldron.slosh .liquid{animation:swirl .6s linear infinite, slosh .5s ease-in-out}
#cauldron .bub{position:absolute;bottom:80%;border-radius:50%;background:rgba(255,255,255,.65);animation:bub 1.8s ease-in infinite;opacity:0}
#cauldron .bub:nth-child(1){left:22%;width:8px;height:8px;animation-delay:.1s}
#cauldron .bub:nth-child(2){left:48%;width:11px;height:11px;animation-delay:.7s}
#cauldron .bub:nth-child(3){left:70%;width:7px;height:7px;animation-delay:1.2s}
#cauldron .bub:nth-child(4){left:36%;width:6px;height:6px;animation-delay:1.5s}
#cauldron .legs{position:absolute;bottom:-8%;left:12%;right:12%;height:14%;display:flex;justify-content:space-between}
#cauldron .legs::before,#cauldron .legs::after{content:"";width:16%;height:100%;background:#1a0a2c;border-radius:0 0 40% 40%}
#go{width:max(72px,var(--go));height:max(72px,var(--go));border-radius:50%;display:grid;place-items:center;gap:0;
  background:radial-gradient(circle at 35% 30%,#ffb1dc,#ff3fa4 45%,#c8127a 100%);font-weight:900;
  box-shadow:0 0 0 5px rgba(255,255,255,.35) inset,0 10px 0 #8a0b52,0 12px 28px rgba(0,0,0,.5),0 0 30px #ff3fa4;
  animation:pulse 1.4s ease-in-out infinite;transition:transform .08s,box-shadow .08s;align-self:center}
#go:active{transform:translateY(6px);box-shadow:0 0 0 5px rgba(255,255,255,.35) inset,0 3px 0 #8a0b52,0 4px 12px rgba(0,0,0,.5),0 0 30px #ff3fa4}
#go .r{font-size:clamp(30px,5.6dvh,52px);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#go .t{font-size:clamp(14px,2.6dvh,24px);letter-spacing:1px;text-shadow:0 2px 0 #8a0b52;margin-top:-2px}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;display:grid;place-items:center;text-align:center;z-index:20;
  background:radial-gradient(ellipse at 50% 30%,#4a0d7a 0%,#12002b 60%,#050014 100%);padding:20px}
#splash.gone{display:none}
#splash h1{font-size:clamp(44px,12vmin,120px);line-height:.95;margin:0;letter-spacing:-1px;
  background:linear-gradient(90deg,#ff3fa4,#ffd23f,#33e6ff,#a855ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,63,164,.7));animation:hue 4s linear infinite}
#splash p{font-size:clamp(18px,3.5vmin,30px);margin:8px 0 26px;color:#e9d7ff;font-weight:800}
#play{font-size:clamp(24px,5vmin,44px);font-weight:900;padding:.55em 1.4em;border-radius:999px;
  background:linear-gradient(160deg,#ff3fa4,#a855ff);box-shadow:0 0 0 5px rgba(255,255,255,.35) inset,0 10px 0 #5b0d9a,0 0 40px #ff3fa4;
  animation:pulse 1.2s ease-in-out infinite}
#play:active{transform:translateY(6px);box-shadow:0 0 0 5px rgba(255,255,255,.35) inset,0 3px 0 #5b0d9a,0 0 40px #ff3fa4}
#splash small{display:block;margin-top:28px;color:#b9a3d6;font-size:clamp(12px,2vmin,16px);font-weight:600;line-height:1.5}
#splash .bottles{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
#splash .bottles .bottle{--bs:clamp(40px,7vmin,64px);pointer-events:none;animation:bob 1.6s ease-in-out infinite}
#splash .bottles .bottle:nth-child(2){animation-delay:.2s}#splash .bottles .bottle:nth-child(3){animation-delay:.4s}
#splash .bottles .bottle:nth-child(4){animation-delay:.6s}#splash .bottles .bottle:nth-child(5){animation-delay:.8s}

/* ---------- photo overlay ---------- */
#photo{position:fixed;inset:0;z-index:30;display:grid;grid-template-rows:1fr auto;gap:14px;place-items:center;
  background:rgba(8,0,20,.92);padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px)}
#photo[hidden]{display:none}
#photo .frame{max-width:100%;max-height:100%;padding:10px;background:#fff;border-radius:14px;box-shadow:0 0 40px #ff3fa4;transform:rotate(-1.5deg);
  animation:popin .4s cubic-bezier(.2,1.6,.4,1);display:grid}
#photo img{max-width:min(92vw,900px);max-height:62dvh;display:block;border-radius:6px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto}
#photo .btns{display:flex;gap:16px}
#photo .btns button{font-size:clamp(20px,4vmin,34px);font-weight:900;padding:.5em 1.1em;border-radius:999px;
  box-shadow:0 0 0 4px rgba(255,255,255,.3) inset,0 8px 0 rgba(0,0,0,.35)}
#photo .btns button:active{transform:translateY(5px);box-shadow:0 0 0 4px rgba(255,255,255,.3) inset,0 3px 0 rgba(0,0,0,.35)}
#save{background:linear-gradient(160deg,#7dff4a,#12b886)}
#back{background:linear-gradient(160deg,#a855ff,#5b0d9a)}
#photo .hint{color:#d7c6f0;font-weight:700;font-size:clamp(13px,2.4vmin,18px);text-align:center;margin:0}

#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%) scale(0);z-index:40;font-size:clamp(28px,8vmin,80px);font-weight:900;
  color:#fff;text-shadow:0 0 20px #ff3fa4,0 4px 0 #5b0d9a;pointer-events:none;transition:transform .3s cubic-bezier(.2,1.6,.4,1)}
#toast.show{transform:translateX(-50%) scale(1)}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes pour{0%{transform:rotate(0)}40%{transform:rotate(-38deg) translate(6px,-8px) scale(1.1)}100%{transform:rotate(0)}}
@keyframes swirl{to{background-position:300% 0}}
@keyframes slosh{0%,100%{transform:scaleX(1)}30%{transform:scaleX(1.08) translateX(-4%)}70%{transform:scaleX(1.08) translateX(4%)}}
@keyframes bub{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.9}100%{transform:translateY(-26px) scale(1.2);opacity:0}}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes hue{to{filter:hue-rotate(360deg) drop-shadow(0 0 18px rgba(255,63,164,.7))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* ---------- dressing room ---------- */
#dress{position:fixed;inset:0;z-index:15;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;color:#fff;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 8px) calc(var(--sab) + 8px) calc(var(--sal) + 8px);
  background:radial-gradient(ellipse at 50% 20%,#4a0d7a 0%,#1a0640 55%,#0a0020 100%)}
#dress[hidden]{display:none}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.dhead h2{margin:0;font-size:clamp(16px,4vmin,34px);letter-spacing:.5px;text-shadow:0 0 14px #ff3fa4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toStage{font-size:clamp(15px,3.6vmin,30px);font-weight:900;padding:.45em 1em;border-radius:999px;white-space:nowrap;flex:0 0 auto;
  background:linear-gradient(160deg,#7dff4a,#12b886);box-shadow:0 0 0 4px rgba(255,255,255,.3) inset,0 7px 0 #0a6b4a,0 0 26px #7dff4a;animation:pulse 1.4s ease-in-out infinite}
#toStage:active{transform:translateY(5px);box-shadow:0 0 0 4px rgba(255,255,255,.3) inset,0 2px 0 #0a6b4a,0 0 26px #7dff4a}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,42%);grid-template-rows:minmax(0,1fr);gap:10px;min-height:0}
@media (orientation:portrait){.dbody{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}}
.dstage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px;min-height:0;height:100%;border-radius:22px;background:var(--panel);padding:6px}
#cvwrap{position:relative;height:100%;min-height:0;border-radius:18px;overflow:hidden}
#cvwrap.over::after{content:"";position:absolute;inset:0;border:5px solid #7dff4a;border-radius:18px;pointer-events:none;box-shadow:0 0 24px #7dff4a inset}
#dressCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.arrow{width:clamp(44px,9vmin,72px);height:clamp(44px,9vmin,72px);border-radius:50%;font-size:clamp(18px,4vmin,32px);display:grid;place-items:center;
  background:linear-gradient(160deg,#4a1a86,#1f0644);box-shadow:0 0 0 3px rgba(255,255,255,.18) inset,0 5px 14px rgba(0,0,0,.45)}
.arrow:active{transform:scale(.9)}
.dname{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-weight:900;font-size:clamp(15px,3.4vmin,28px);letter-spacing:1px;
  background:var(--pink);padding:2px 16px;border-radius:999px;box-shadow:0 0 16px rgba(255,255,255,.4),0 0 0 2px rgba(255,255,255,.4) inset;text-shadow:0 1px 0 rgba(0,0,0,.4);pointer-events:none}
.dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:7px;pointer-events:none}
.dots i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{background:#fff;box-shadow:0 0 8px #fff}
.dpanel{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:8px;min-height:0;border-radius:22px;background:var(--panel);padding:8px;overflow:hidden}
.tabs{display:flex;gap:5px}
.tab{flex:1 1 0;min-width:0;display:grid;place-items:center;padding:5px 2px;border-radius:14px;background:rgba(255,255,255,.08);font-weight:900;font-size:clamp(8px,1.8vmin,13px);letter-spacing:.3px}
.tab i{font-style:normal;font-size:clamp(18px,4vmin,30px);line-height:1.1}
.tab.on{background:var(--violet);box-shadow:0 0 14px var(--violet),0 0 0 2px rgba(255,255,255,.35) inset}
.items{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-content:start;min-height:0}
.tile{width:100%;height:auto;aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.08);touch-action:none;cursor:grab;transition:transform .1s}
.tile:active{transform:scale(.92)}
.tile.on{box-shadow:0 0 0 4px #fff inset,0 0 14px #fff;background:rgba(255,255,255,.18)}
.swatches{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.sw{width:clamp(32px,5vmin,44px);height:clamp(32px,5vmin,44px);border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.4) inset,0 2px 6px rgba(0,0,0,.4);transition:transform .1s}
.sw.on{box-shadow:0 0 0 4px #fff inset,0 0 12px #fff;transform:scale(1.15)}
#surprise{font-weight:900;font-size:clamp(14px,3vmin,22px);padding:.4em 1.1em;border-radius:999px;justify-self:center;
  background:linear-gradient(160deg,#ff3fa4,#a855ff);box-shadow:0 0 0 3px rgba(255,255,255,.3) inset,0 5px 0 #5b0d9a}
#surprise:active{transform:translateY(4px);box-shadow:0 0 0 3px rgba(255,255,255,.3) inset,0 1px 0 #5b0d9a}

function scheduleStep(s, t){

  let n = Math.round((shape==='notes'?70:shape==='peony'?110:120) * M.count * potions * (same?1.3:1) * (willow?0.8:1) * (small?0.45:1));
  n = Math.min(n, 460);
  const S = (willow?250:shape==='peony'?230:260) * U * scale;
  const drag = willow?2.6:glitter?1.9:1.5, grav = (willow?230:170)*U*M.grav;
  const lifeBase = willow?rnd(4,6.5):glitter?rnd(2.6,4):rnd(1.6,2.6), life = clamp(lifeBase*M.life, 0.6, 8);
  const spin = shape==='spiral' ? 1.6 : 0;
  const twinkleAll = glitter || colours.some(c=>c.twinkle);
  const nc = colours.length;
  for (let k=0;k<n;k++){
    const [dx,dy] = shapePoint(shape==='notes'?'peony':shape, k, n);
    const jitter = shape==='peony' ? 1 : rnd(0.94,1.06);
    // mixed colours show as clear bands: concentric rings for peonies, segments around the outline for shapes
    let band = 0;
    if (nc > 1) band = shape==='peony' || shape==='notes' ? Math.min(nc-1, Math.floor((Math.hypot(dx,dy)-0.35)/0.65*nc)) : Math.floor(k/n*nc*3) % nc;
    const c = colourFor(colours, band);
    const speed = S*jitter*(shape==='peony'?1:0.95);
    spawn({x, y, vx:dx*speed, vy:dy*speed, life, max:life, h:c.h, s:c.s, l:willow?Math.min(90,c.l+14):c.l,
      sz:2.8*U*sizeM, drag, grav, spin, tw:!!(c.tw||twinkleAll), glit:glitter, willow, tx:x, ty:y, tx2:x, ty2:y});
  }
  if (shape==='notes'){
    for (let k=0;k<16;k++){ const a = rnd(TAU), c = colourFor(colours,k);
      spawn({x,y,vx:Math.cos(a)*S*0.55,vy:Math.sin(a)*S*0.55-60*U,life:2.4,max:2.4,h:c.h,s:c.s,l:c.l,sz:1,drag:1.6,grav:90*U,spin:0,note:pick(NOTES),tx:x,ty:y,tx2:x,ty2:y}); }
  }
  if (willow){ // extra golden strands
    for (let k=0;k<40;k++){ const a = rnd(TAU), r = rnd(0.5,1);
      spawn({x,y,vx:Math.cos(a)*S*r,vy:Math.sin(a)*S*r,life:rnd(4,6),max:5,h:48,s:100,l:72,sz:2.2*U,drag:2.6,grav:230*U,spin:0,willow:true,tw:true,tx:x,ty:y,tx2:x,ty2:y}); }
  }
  const c0 = colourFor(colours, 0);
  FLASHES.push({x,y,r:170*U*scale,h:c0.h,s:c0.s,a:1});
  flashA = Math.max(flashA, small?0.06:big?0.28:0.14); flashH = c0.h; shake = Math.max(shake, small?0:big?9:3);
  cheer = Math.min(1, cheer + (big?0.6:0.3));
  if (AC){ sfxBoom(big && !small, x); if (glitter && !small) sfxCrackle(x); if (chord) sfxChord(); if (big && !small) sfxCheer(); }
  // Boo-Bops caught in the light pop into bubbles
  const R = 180*U*scale;
  for (const b of BOOBOPS){ if (!b.dead && Math.hypot(b.x-x, b.y-y) < R + b.r) popBooBop(b); }
}

/* ================= POTION CANNON ================= */
// The cannon sits in the cauldron and swings to follow the mouse / last finger; it only fires when there is a potion mix.
const aim = {x:0, y:0, a:-Math.PI/2, show:0}; let cannonKick = 0, mixCss = [];
function cannonGeom(){
  const cr = $('#cauldron').getBoundingClientRect();
  const px = cr.width ? cr.left + cr.width/2 : W/2, py = cr.height ? cr.top + cr.height*0.12 : H*0.85;
  const L = Math.max(64*U, (cr.width||100)*0.62), w = Math.max(22*U, (cr.width||100)*0.3);
  return {px, py, L, w};
}
function aimAngle(px, py, x, y){ return clamp(Math.atan2(y-py, x-px), -Math.PI+0.3, -0.3); }
function nope(){
  const c = $('#cauldron'); c.classList.remove('nope'); void c.offsetWidth; c.classList.add('nope');
  document.querySelectorAll('#ui .bottle').forEach(b => { b.classList.remove('hint'); void b.offsetWidth; b.classList.add('hint'); });
  toast('🧪 ADD A POTION!'); lastTouch = performance.now();
  if (AC){ const t=now(); tone(240,t,0.28,{type:'triangle',vol:0.25,glide:110}); tone(180,t+0.12,0.25,{type:'triangle',vol:0.2,glide:90}); }
}

function launch(tx, ty, ids){
  if (!ids && !mix.length){ nope(); return; }
  if (tx===undefined){ tx = rnd(W*0.15, W*0.85); ty = rnd(H*0.12, H*0.5); }
  const m = (ids||mix).map(id=>byId[id]);
  const high = m.some(p=>p.high), fast = high || m.some(p=>p.fast);
  const {px, py, L} = cannonGeom();
  if (high) ty = Math.min(ty, H*0.22);
  ty = clamp(ty, H*0.06, py - 80*U);
  const a = aimAngle(px, py, tx, ty); aim.x = tx; aim.y = ty; aim.a = a; cannonKick = 1;
  const x0 = px + Math.cos(a)*L, y0 = py + Math.sin(a)*L;
  const T = high ? 0.55 : fast ? 0.62 : clamp(0.7 + Math.hypot(tx-x0, ty-y0)/(900*U), 0.7, 1.15);
  const g = 500*U;
  ROCKETS.push({x:x0, y:y0, vx:(tx-x0)/T, vy:(ty-y0)/T - 0.5*g*T, g, t:0, T, m, h:(m.find(p=>p.h!==undefined)||{h:48}).h, high});
  for (let k=0;k<10;k++){ const ang = a + rnd(-0.5,0.5), sp = rnd(80,260)*U;   // muzzle flash sparks
    spawn({x:x0,y:y0,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:rnd(0.2,0.45),max:0.4,h:(m.find(p=>p.h!==undefined)||{h:48}).h,s:100,l:80,sz:2*U,drag:3,grav:200*U,spin:0,tx:x0,ty:y0,tx2:x0,ty2:y0}); }
  if (AC) sfxLaunch(fast);
  launches++; lastTouch = performance.now();
  if (launches % 10 === 0) addStar();
  cheer = Math.min(1, cheer+0.1);
}
function drawCannon(t, dt){
  const {px, py, L, w} = cannonGeom();
  if (aim.x || aim.y){ const ta = aimAngle(px, py, aim.x, aim.y); aim.a += (ta-aim.a)*Math.min(1, dt*12); }
  cannonKick = Math.max(0, cannonKick - dt*5); aim.show = Math.max(0, aim.show - dt);
  const c1 = mixCss[0] || '#7b3fe4', c2 = mixCss[1] || mixCss[0] || '#3a1866';
  ctx.save(); ctx.translate(px, py); ctx.rotate(aim.a); ctx.translate(-cannonKick*10*U, 0);
  // barrel
  const grd = ctx.createLinearGradient(0,-w/2,0,w/2); grd.addColorStop(0,'#ffffff'); grd.addColorStop(0.18,c1); grd.addColorStop(0.7,c2); grd.addColorStop(1,'#1a0630');
  ctx.fillStyle = grd; ctx.shadowColor = c1; ctx.shadowBlur = mix.length ? 16 : 0;
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-w*0.3, -w/2, L+w*0.3, w, w*0.35); else ctx.rect(-w*0.3, -w/2, L+w*0.3, w); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(L*0.35, -w/2, w*0.22, w); ctx.fillRect(L*0.72, -w/2, w*0.22, w);   // bands
  ctx.fillStyle = '#fff'; ctx.fillRect(L*0.1, -w*0.36, L*0.2, w*0.1);                                                  // shine
  // muzzle ring + glow
  ctx.fillStyle = '#2a1440'; ctx.beginPath(); ctx.ellipse(L, 0, w*0.16, w*0.55, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = mix.length ? c1 : '#3a1866'; ctx.beginPath(); ctx.ellipse(L, 0, w*0.1, w*0.4, 0, 0, TAU); ctx.fill();
  if (mix.length){ ctx.globalCompositeOperation = 'lighter'; const mg = ctx.createRadialGradient(L,0,0,L,0,w*(1+0.3*Math.sin(t*6)));
    mg.addColorStop(0,'rgba(255,255,255,0.7)'); mg.addColorStop(0.4,c1+'99'); mg.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(L,0,w*1.4,0,TAU); ctx.fill(); }
  ctx.restore();
  // aim guide dots
  if (aim.show > 0 && mix.length){ const mx = px+Math.cos(aim.a)*L, my = py+Math.sin(aim.a)*L; ctx.fillStyle = `rgba(255,255,255,${0.7*Math.min(1,aim.show)})`;
    for (let k=1;k<=8;k++){ const f=k/9; ctx.beginPath(); ctx.arc(mx+(aim.x-mx)*f, my+(aim.y-my)*f - Math.sin(f*Math.PI)*40*U, (4-2*f)*U, 0, TAU); ctx.fill(); } }
}

/* ================= BOO-BOPS (fun smiley demons) & BUBBLES ================= */
// Boo-Bops float down to borrow the Giant Lightstick's glow. A firework pops them into bubbles or a mini firework.
let nextBoo = 3500;
function spawnBooBop(){
  const side = Math.random(); let x, y;
  if (side < 0.5){ x = rnd(W*0.1, W*0.9); y = -50*U; } else { x = side<0.75 ? -50*U : W+50*U; y = rnd(H*0.05, H*0.4); }
  BOOBOPS.push({x, y, r:rnd(24,32)*U, p:rnd(TAU), hue:pick([285,300,320,265,200,170]), speed:rnd(26,44)*U, state:'seek', t:0, dead:false, orb:0, wave:rnd(TAU)});
}
function popBooBop(b){
  if (b.dead) return; b.dead = true; addStar(); if (AC) sfxGiggle();
  if (b.state==='flee'){ glowTarget = Math.min(1, glowTarget + 0.2 + 0.2); } else glowTarget = Math.min(1, glowTarget + 0.15);
  if (Math.random() < 0.55){ // soap bubbles
    for (let k=0;k<14;k++){ const a=rnd(TAU), sp=rnd(30,110)*U;
      BUBBLES.push({x:b.x+Math.cos(a)*b.r*0.4, y:b.y+Math.sin(a)*b.r*0.4, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40*U, r:rnd(7,20)*U, life:rnd(1.6,3.4), hue:b.hue, p:rnd(TAU)}); }
    for (let k=0;k<30;k++){ const a=rnd(TAU), sp=rnd(40,160)*U;
      spawn({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(0.8,1.4),max:1.2,h:b.hue,s:90,l:80,sz:2.5*U,drag:2.5,grav:40*U,spin:0,tw:true,tx:b.x,ty:b.y,tx2:b.x,ty2:b.y}); }
    toast(pick(['BUBBLES!','✨ POP! ✨','TEE-HEE!','💖']));
  } else { // mini firework
    explode(b.x, b.y, [byId[pick(COLOURS).id], byId[pick(['glitter','heart','star','spin'])]], true);
    toast(pick(['POP!','BOOM-BOP!','YAY!','⭐']));
  }
}
function powerUp(){
  toast('⭐ POWER UP! ⭐'); rainbowSky = 1.8; cheer = 1; if (AC) sfxTenStars();
  setTimeout(()=>launch(W*0.25,H*0.22,['pink','bass','glitter']),150); setTimeout(()=>launch(W*0.5,H*0.14,['rainbow','bass','heart']),500); setTimeout(()=>launch(W*0.75,H*0.22,['blue','bass','star']),850);
  setTimeout(()=>{ for (const b of BOOBOPS) popBooBop(b); glowTarget = 1; }, 1400);
}

/* ================= DRAW ================= */
let last = performance.now(), beat = 0;
function frame(nowMs){
  requestAnimationFrame(frame);
  let dt = (nowMs-last)/1000; last = nowMs; if (dt>0.05) dt=0.05;
  const t = nowMs/1000; beat = (t*BPM/60)%1;
  update(dt, nowMs);
  if (dressOpen) drawDress(t, dt); else draw(t, dt);
}
function update(dt, nowMs){
  // rockets
  for (let i=ROCKETS.length-1;i>=0;i--){ const r=ROCKETS[i]; r.t+=dt; r.vy += r.g*dt; r.x += r.vx*dt; r.y += r.vy*dt;
    for (let k=0;k<2;k++) spawn({x:r.x,y:r.y,vx:rnd(-30,30)*U-r.vx*0.1,vy:rnd(20,80)*U,life:rnd(0.25,0.5),max:0.4,h:r.h,s:90,l:75,sz:1.6*U,drag:2,grav:100*U,spin:0,tx:r.x,ty:r.y,tx2:r.x,ty2:r.y});
    let hit = false; for (const b of BOOBOPS){ if (!b.dead && Math.hypot(b.x-r.x, b.y-r.y) < b.r*1.1){ hit = true; break; } }
    if (r.t >= r.T || hit){ ROCKETS.splice(i,1); explode(r.x, r.y, r.m); }
  }
  // particles
  for (let i=P.length-1;i>=0;i--){ const p=P[i]; p.life -= dt;
    if (p.life<=0){ P[i]=P[P.length-1]; P.pop(); continue; }
    p.tx2=p.tx; p.ty2=p.ty; p.tx=p.x; p.ty=p.y;
    const d = Math.exp(-p.drag*dt); p.vx*=d; p.vy*=d; p.vy += p.grav*dt;
    if (p.spin){ const a=p.spin*dt, c=Math.cos(a), s=Math.sin(a); const vx=p.vx*c-p.vy*s; p.vy=p.vx*s+p.vy*c; p.vx=vx; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.glit && Math.random()<dt*2.2 && P.length<MAXP-50) P.push({x:p.x,y:p.y,vx:rnd(-40,40)*U,vy:rnd(-40,40)*U,life:rnd(0.2,0.5),max:0.4,h:p.h,s:60,l:92,sz:1.8*U,drag:1,grav:60*U,spin:0,tw:true,tx:p.x,ty:p.y,tx2:p.x,ty2:p.y});
  }
  for (let i=FLASHES.length-1;i>=0;i--){ FLASHES[i].a -= dt*4; if (FLASHES[i].a<=0) FLASHES.splice(i,1); }
  flashA = Math.max(0, flashA - dt*1.2); shake = Math.max(0, shake - dt*30); cheer = Math.max(0, cheer - dt*0.25); rainbowSky = Math.max(0, rainbowSky-dt);
  // boo-bops
  glow += (glowTarget-glow)*Math.min(1, dt*3);
  if (started && !dressOpen){ nextBoo -= dt*1000;
    if (nextBoo<=0 && BOOBOPS.filter(b=>!b.dead).length<4){ spawnBooBop(); nextBoo = rnd(4500,9000); } }
  for (let i=BOOBOPS.length-1;i>=0;i--){ if (dressOpen) break; const b=BOOBOPS[i]; b.p+=dt; b.t+=dt;
    if (b.dead){ BOOBOPS.splice(i,1); continue; }
    if (b.state==='seek'){ const dx=lsx-b.x, dy=lsy-b.y, d=Math.hypot(dx,dy)||1;
      b.x += (dx/d)*b.speed*dt + Math.cos(b.p*1.7+b.wave)*30*U*dt; b.y += (dy/d)*b.speed*dt + Math.sin(b.p*2.1)*12*U*dt;
      if (d < 34*U){ b.state='steal'; b.t=0; cheer = Math.max(cheer, 0.6); } }
    else if (b.state==='steal'){ b.x = lsx + Math.cos(b.t*9)*10*U; b.y = lsy - 10*U + Math.sin(b.t*9)*6*U;
      if (b.t > 0.9){ b.state='flee'; b.orb=1; glowTarget = Math.max(0, glowTarget-0.2); if (glowTarget<=0.01) powerUp(); b.vx = (Math.random()<0.5?-1:1)*rnd(20,40)*U; toast(pick(['HEY!','GLOW THIEF!','GET IT!'])); } }
    else { b.x += b.vx*dt + Math.cos(b.p*2)*20*U*dt; b.y -= (30*U)*dt;
      if (b.y < -80*U || b.x < -100*U || b.x > W+100*U) BOOBOPS.splice(i,1); }
  }
  // bubbles
  for (let i=BUBBLES.length-1;i>=0;i--){ const b=BUBBLES[i]; b.life-=dt; b.p+=dt; b.vx*=Math.exp(-1.5*dt); b.vy = b.vy*Math.exp(-1.5*dt) - 30*U*dt;
    b.x += b.vx*dt + Math.sin(b.p*3)*14*U*dt; b.y += b.vy*dt;
    if (b.life<=0 || b.y < -30){ BUBBLES.splice(i,1);
      if (AC && Math.random()<0.5){ const t0=now(); tone(1100+rnd(900), t0, 0.06, {type:'sine', vol:0.08, glide:2200}); }
      for (let k=0;k<4;k++){ const a=rnd(TAU); spawn({x:b.x,y:b.y,vx:Math.cos(a)*50*U,vy:Math.sin(a)*50*U,life:0.3,max:0.3,h:b.hue,s:80,l:90,sz:1.5*U,drag:2,grav:0,spin:0,tx:b.x,ty:b.y,tx2:b.x,ty2:b.y}); } } }
  // finale
  if (!dressOpen && nowMs < finaleUntil && nowMs >= nextFinaleShot){ nextFinaleShot = nowMs + rnd(220,420);
    const ids = [pick(COLOURS).id]; if (Math.random()<0.6) ids.push(pick(COLOURS).id); if (Math.random()<0.85) ids.push(pick(MAGICS).id); if (Math.random()<0.4) ids.push(pick(MAGICS).id);
    launch(rnd(W*0.1,W*0.9), rnd(H*0.08,H*0.5), ids); }
  else if (finaleUntil && nowMs >= finaleUntil){ finaleUntil = 0; $('#finale').classList.remove('busy');
    launch(W*0.25,H*0.2,['pink','bass','glitter']); setTimeout(()=>launch(W*0.5,H*0.14,['rainbow','bass','heart']),300); setTimeout(()=>launch(W*0.75,H*0.2,['blue','bass','star']),600); }
  // idle attract
  if (started && !dressOpen && nowMs - lastTouch > 20000 && !ROCKETS.length){ lastTouch = nowMs - 8000; launch(rnd(W*0.2,W*0.8), rnd(H*0.15,H*0.4), [pick(COLOURS).id, pick(MAGICS).id]); }
}

function draw(t, dt){
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  if (shake>0.3) ctx.translate(rnd(-shake,shake), rnd(-shake,shake));
  // sky
  const g = ctx.createLinearGradient(0,0,0,H);
  if (rainbowSky>0){ const hh=(t*200)%360; g.addColorStop(0,`hsl(${hh},70%,${12+rainbowSky*10}%)`); g.addColorStop(1,`hsl(${(hh+120)%360},80%,${28+rainbowSky*10}%)`); }
  else { g.addColorStop(0,'#04000f'); g.addColorStop(0.55,'#1a0640'); g.addColorStop(1,'#4a0d6e'); }
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // horizon glow
  const hg = ctx.createRadialGradient(W/2, ctlTop, 0, W/2, ctlTop, Math.max(W,H)*0.7);
  hg.addColorStop(0,'rgba(255,63,164,0.35)'); hg.addColorStop(0.5,'rgba(168,85,255,0.12)'); hg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = hg; ctx.fillRect(0,0,W,H);
  if (flashA>0){ ctx.fillStyle = hsl(flashH,100,70,flashA); ctx.fillRect(0,0,W,H); }
  // moon
  ctx.fillStyle = '#fff6d5'; ctx.shadowColor = '#ffe9a8'; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(W*0.84, H*0.13, 22*U, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#12052a'; ctx.beginPath(); ctx.arc(W*0.84+12*U, H*0.13-6*U, 19*U, 0, TAU); ctx.fill();
  // stars
  for (const s of stars){ const a = 0.4+0.6*Math.abs(Math.sin(t*s.s+s.p)); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(s.x*W, s.y*H, s.r*U*1.5, s.r*U*1.5); }
  // skyline
  const hz = ctlTop - 6*U;
  ctx.fillStyle = '#0d0322';
  for (const b of skyline){ const bw=b.w*W, bh=b.h*H*0.9; ctx.fillRect(b.x*W, hz-bh, bw+1, bh+10);
    if (b.win){ ctx.fillStyle = 'rgba(255,220,120,0.55)'; for (let y=hz-bh+6*U; y<hz-6*U; y+=9*U) for (let x=b.x*W+4*U; x<b.x*W+bw-4*U; x+=8*U) if (((x*7+y*13)|0)%5<2) ctx.fillRect(x,y,3*U,4*U); ctx.fillStyle='#0d0322'; } }
  // spotlights
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<3;i++){ const sx = W*(0.2+0.3*i), ang = -Math.PI/2 + Math.sin(t*0.7+i*2.1)*0.55; const len = H*0.95;
    const grd = ctx.createLinearGradient(sx, hz, sx+Math.cos(ang)*len, hz+Math.sin(ang)*len);
    const col = ['255,63,164','51,230,255','168,85,255'][i]; grd.addColorStop(0,`rgba(${col},${0.22+cheer*0.2})`); grd.addColorStop(1,`rgba(${col},0)`);

    ctx.beginPath(); ctx.moveTo(cx-bw, y); ctx.quadraticCurveTo(cx-bw, y-ch*0.85, cx, y-ch*0.8); ctx.quadraticCurveTo(cx+bw, y-ch*0.85, cx+bw, y); ctx.fill();
    // lightstick
    const ang = -Math.PI/2 + Math.sin(t*(2+cheer*3)+c.p)*(0.35+cheer*0.4), sl = ch*0.55, sx = cx + (c.row?-1:1)*bw*0.6, sy = y-ch*0.7;
    ctx.strokeStyle = '#2a1440'; ctx.lineWidth = 2.5*U; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx+Math.cos(ang)*sl, sy+Math.sin(ang)*sl); ctx.stroke();
    const tipx = sx+Math.cos(ang)*sl, tipy = sy+Math.sin(ang)*sl;
    ctx.fillStyle = hsl(c.c.h, c.c.s, 70, 0.25+cheer*0.3); ctx.beginPath(); ctx.arc(tipx,tipy,7*U,0,TAU); ctx.fill();
    ctx.fillStyle = hsl(c.c.h, c.c.s, 80, 0.95); ctx.beginPath(); ctx.arc(tipx,tipy,3*U,0,TAU); ctx.fill();
  }
}

/* ================= UI BUILD ================= */
function bottleHTML(p){
  return `<button class="bottle" data-id="${p.id}" style="--c:${p.css.startsWith('linear')?'#ff7ad9':p.css}" aria-label="${p.name}">
    <span class="cork"></span><span class="neck"></span>
    <span class="glass" ${p.rainbow?`style="background:${p.css}"`:''}><span class="eyes"><i></i><i></i></span><span class="icon">${p.icon}</span></span><span class="n"></span></button>`;
}
$('#left').innerHTML = '<span class="lbl"><i>🎨</i><b>COLOURS</b></span>' + COLOURS.map(bottleHTML).join('');
$('#right').innerHTML = '<span class="lbl"><i>✨</i><b>MAGIC</b></span>' + MAGICS.map(bottleHTML).join('');
$('#splashBottles').innerHTML = [COLOURS[0],COLOURS[2],MAGICS[0],COLOURS[3],MAGICS[1]].map(bottleHTML).join('');

function renderMix(){
  const chips = $('#chips'); chips.innerHTML = mix.map(id => { const p=byId[id]; return `<span style="--c:${p.css.startsWith('linear')?'#ff7ad9':p.css}">${p.icon}</span>`; }).join('');
  const counts = {}; mix.forEach(id => counts[id] = (counts[id]||0)+1);
  document.querySelectorAll('#ui .bottle').forEach(b => { const n = counts[b.dataset.id]||0; b.classList.toggle('in-mix', n>0); b.querySelector('.n').textContent = n; });
  const cols = mix.map(id=>byId[id]).filter(p=>p.h!==undefined||p.rainbow);
  const c = $('#cauldron');
  if (!mix.length){ c.style.removeProperty('--liq'); c.style.removeProperty('--glow'); mixCss = []; return; }
  const stops = (cols.length?cols:mix.map(id=>byId[id])).map(p=>p.rainbow?'#ff3fa4,#ffd23f,#7dff4a,#33e6ff,#a855ff':p.css);
  const list = stops.join(','); mixCss = list.split(',');
  c.style.setProperty('--liq', `linear-gradient(90deg,${list},${list.split(',')[0]})`);
  c.style.setProperty('--glow', list.split(',')[0]);
}
function addPotion(id, btn){
  initAudio(); lastTouch = performance.now();
  mix.push(id); while (mix.length>3) mix.shift();   // repeats allowed: three golds = one big gold
  renderMix(); if (AC) sfxPour(ALL.findIndex(p=>p.id===id));
  if (btn){ btn.classList.remove('pour'); void btn.offsetWidth; btn.classList.add('pour'); }
  const c = $('#cauldron'); c.classList.remove('slosh'); void c.offsetWidth; c.classList.add('slosh');
}
document.querySelectorAll('#ui .bottle').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); addPotion(b.dataset.id, b); }));
$('#clear').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); mix.length=0; renderMix(); if (AC){ const t=now(); tone(500,t,0.15,{type:'sine',vol:0.2,glide:150}); } lastTouch=performance.now(); });
$('#cauldron').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); const c=$('#cauldron'); c.classList.remove('slosh'); void c.offsetWidth; c.classList.add('slosh'); if (AC){ const t=now(); for(let k=0;k<3;k++) tone(rnd(300,600),t+k*0.06,0.1,{type:'sine',vol:0.15,glide:200}); } lastTouch=performance.now(); });
$('#go').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); launch(); });
cv.addEventListener('pointerdown', e => { e.preventDefault(); if (!started) return; initAudio(); aim.x = e.clientX; aim.y = e.clientY; launch(e.clientX, e.clientY); });
cv.addEventListener('pointermove', e => { if (!started) return; aim.x = e.clientX; aim.y = e.clientY; aim.show = e.pointerType==='mouse' ? 0.5 : 0.8; });
$('#finale').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); if (performance.now() < finaleUntil) return; finaleUntil = performance.now()+10000; nextFinaleShot = 0; $('#finale').classList.add('busy'); toast('🎆 FINALE! 🎆'); cheer = 1; lastTouch = performance.now(); });
$('#music').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); setMusic(!musicOn); });
document.addEventListener('contextmenu', e => { if (e.target.id!=='shot') e.preventDefault(); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

/* ================= SCREENSHOT ================= */
let shotBlob = null, shotURL = null;
$('#snap').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); lastTouch = performance.now();
  if (AC){ const t=now(); noise(t,0.08,{vol:0.4,lp:8000,hp:2000}); tone(1800,t+0.06,0.12,{type:'square',vol:0.08}); }
  flashA = 0.6; flashH = 0;
  setTimeout(() => cv.toBlob(b => { if (!b) return; shotBlob = b; if (shotURL) URL.revokeObjectURL(shotURL); shotURL = URL.createObjectURL(b);
    $('#shot').src = shotURL; $('#photo').hidden = false; $('#ui').classList.add('hidden');
    $('#hint').textContent = navigator.canShare ? 'Save opens your share sheet — choose "Save Image" for Photos' : 'Press and hold the photo to save it too';
  }, 'image/png'), 30);
});
function shotName(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `kpop-boom-fireworks-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`; }
$('#save').addEventListener('click', async () => {
  if (!shotBlob) return;
  const file = new File([shotBlob], shotName(), {type:'image/png'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:'My fireworks!'}); return; } catch(err){ if (err && err.name==='AbortError') return; }
  }
  const a = document.createElement('a'); a.href = shotURL; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  toast('💾 Saved!');
});
$('#back').addEventListener('click', () => { $('#photo').hidden = true; $('#ui').classList.remove('hidden'); lastTouch = performance.now(); });

/* ================= DRESSING ROOM ================= */
// Style the three Glow Girls before the show. Tap an item (or drag it onto the girl) to wear it; swatches recolour the current category.
let dressOpen = false, curChar = 0, curCat = 'hair', dragging = null, stageOpened = false, swipeX = null;
const dcv = $('#dressCv'), dctx = dcv.getContext('2d'), DSPARK = [];
function openDress(){ dressOpen = true; $('#dress').hidden = false; $('#ui').classList.add('hidden'); renderDress(); lastTouch = performance.now(); }
function toStage(){
  dressOpen = false; $('#dress').hidden = true; $('#ui').classList.remove('hidden'); saveLooks(); setTimeout(resize, 50); lastTouch = performance.now();
  cheer = 1; toast("🎤 LET'S GO!"); if (AC) sfxCheer();
  if (!stageOpened){ stageOpened = true; setTimeout(()=>launch(W*0.5, H*0.25, ['pink','heart','glitter']), 600); setTimeout(()=>launch(W*0.3, H*0.3, ['blue','star']), 1200); setTimeout(()=>launch(W*0.7, H*0.3, ['gold','rainbow']), 1700); }
}
function isOn(look, cat, id){ return cat==='face' ? look.face.includes(id) : look[cat].style===id; }
function renderDress(){
  $('#dname').textContent = CHARS[curChar].name; $('#dname').style.background = LOOKS[curChar].top.color; $('#dname').style.color = LOOKS[curChar].top.color==='#ffffff' ? '#1a0630' : '#fff';
  $('#ddots').innerHTML = CHARS.map((c,i) => `<i class="${i===curChar?'on':''}"></i>`).join('');
  $('#dtabs').innerHTML = CATS.map(([id,ic,lb]) => `<button class="tab ${id===curCat?'on':''}" data-cat="${id}"><i>${ic}</i>${lb}</button>`).join('');
  $('#dtabs').querySelectorAll('.tab').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); setCat(b.dataset.cat); }));
  renderTiles(); renderSwatches();
}
function setCat(cat){ curCat = cat; renderDress(); if (AC){ const t0=now(); tone(700,t0,0.08,{type:'square',vol:0.06}); } }
function renderTiles(){
  const look = LOOKS[curChar], box = $('#ditems'); box.innerHTML = '';
  for (const [id,name] of WARDROBE[curCat]){ const c = document.createElement('canvas'); c.className = 'tile' + (isOn(look,curCat,id)?' on':''); c.width = c.height = 128; c.dataset.id = id; c.title = name; c.setAttribute('aria-label', name); drawTile(c, look, curCat, id); box.appendChild(c); attachDrag(c, id); }
}
function drawTile(c, look, cat, id){
  const tl = JSON.parse(JSON.stringify(look)); if (cat==='face') tl.face = [id]; else tl[cat] = {style:id, color:look[cat].color};
  const saved = ctx; ctx = c.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,128,128);
  const [gh, cy] = {hair:[115,0.92], face:[300,0.905], top:[200,0.64], bottom:[185,0.42], shoes:[170,0.16]}[cat];   // zoom on the relevant body part
  ctx.save(); ctx.beginPath(); ctx.arc(64,64,62,0,TAU); ctx.clip(); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
  drawGirl(CHARS[curChar], tl, 0, 64, 64 + cy*gh, gh, 0, true); ctx.restore(); ctx = saved;
}
function renderSwatches(){
  const look = LOOKS[curChar], cur = curCat==='face' ? look.faceColor : look[curCat].color;
  $('#dswatches').innerHTML = PALETTE.map(c => `<button class="sw ${c===cur?'on':''}" style="--c:${c}" data-c="${c}" aria-label="colour ${c}"></button>`).join('');
  $('#dswatches').querySelectorAll('.sw').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); setColor(b.dataset.c); }));
}
function applyItem(cat, id){
  const look = LOOKS[curChar];
  if (cat==='face'){ if (look.face.includes(id)) look.face = look.face.filter(f=>f!==id); else { for (const grp of EXCL) if (grp.includes(id)) look.face = look.face.filter(f=>!grp.includes(f)); look.face.push(id); } }
  else look[cat] = {style:id, color:look[cat].color};
  saveLooks(); renderTiles(); dressSparkle(); if (AC) sfxPour(WARDROBE[cat].findIndex(w=>w[0]===id));
}
function setColor(col){
  const look = LOOKS[curChar]; if (curCat==='face') look.faceColor = col; else look[curCat].color = col;
  saveLooks(); renderTiles(); renderSwatches(); $('#dname').style.background = look.top.color; dressSparkle();
  if (AC){ const t0=now(); tone(900,t0,0.1,{type:'triangle',vol:0.15}); tone(1350,t0+0.06,0.12,{type:'triangle',vol:0.12}); }
}
function switchChar(d){ curChar = (curChar + d + 3) % 3; renderDress(); dressSparkle(); if (AC) noise(now(), 0.25, {vol:0.2, lp:3000, hp:400}); }
function surprise(){
  const look = LOOKS[curChar], rc = () => pick(PALETTE);
  look.hair = {style:pick(WARDROBE.hair)[0], color:rc()}; look.top = {style:pick(WARDROBE.top)[0], color:rc()}; look.bottom = {style:pick(WARDROBE.bottom)[0], color:rc()}; look.shoes = {style:pick(WARDROBE.shoes)[0], color:rc()};
  look.face = []; look.faceColor = rc(); const n = 1 + ((Math.random()*2)|0); for (let k=0;k<n;k++){ const id = pick(WARDROBE.face)[0]; for (const grp of EXCL) if (grp.includes(id)) look.face = look.face.filter(f=>!grp.includes(f)); if (!look.face.includes(id)) look.face.push(id); }
  saveLooks(); renderDress(); dressSparkle(); if (AC) sfxGiggle(); toast(pick(['✨ TA-DA! ✨','SO CUTE!','SLAY! 💅','OOH LA LA!']));
}
function overPreview(e){ const r = dcv.getBoundingClientRect(); return e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom; }
function attachDrag(el, id){
  el.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); try { el.setPointerCapture(e.pointerId); } catch(err){} dragging = {id, cat:curCat, x0:e.clientX, y0:e.clientY, moved:false, ghost:null}; });
  el.addEventListener('pointermove', e => { if (!dragging) return;
    if (!dragging.moved && Math.hypot(e.clientX-dragging.x0, e.clientY-dragging.y0) > 12){ dragging.moved = true; const gh = document.createElement('canvas'); gh.width = gh.height = 128; gh.getContext('2d').drawImage(el,0,0); gh.className = 'ghost'; document.body.appendChild(gh); dragging.ghost = gh; }
    if (dragging.ghost){ dragging.ghost.style.left = e.clientX+'px'; dragging.ghost.style.top = e.clientY+'px'; $('#cvwrap').classList.toggle('over', overPreview(e)); } });
  const end = e => { if (!dragging) return; const d = dragging; dragging = null; if (d.ghost) d.ghost.remove(); $('#cvwrap').classList.remove('over');
    if (!d.moved || overPreview(e)) applyItem(d.cat, d.id); else if (AC){ const t0=now(); tone(300,t0,0.12,{type:'triangle',vol:0.12,glide:150}); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
dcv.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); swipeX = e.clientX; });
dcv.addEventListener('pointerup', e => { if (swipeX===null) return; const dx = e.clientX - swipeX; swipeX = null; if (Math.abs(dx) > 50) switchChar(dx<0?1:-1); else { dressSparkle(); cheer = 1; if (AC) sfxChord(); } });
$('#prevChar').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); switchChar(-1); });
$('#nextChar').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); switchChar(1); });
$('#surprise').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); surprise(); });
$('#toStage').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); toStage(); });
$('#wardrobe').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); openDress(); });
function dressSparkle(){ const r = dcv.getBoundingClientRect(); for (let k=0;k<40;k++){ const a = rnd(TAU), sp = rnd(40,220); DSPARK.push({x:r.width/2, y:r.height*0.55, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-60, life:rnd(0.5,1.1), h:(Math.random()*360)|0}); } }
function drawDress(t, dt){
  const r = dcv.getBoundingClientRect(); if (!r.width) return; const pw = Math.round(r.width), ph = Math.round(r.height);
  if (dcv.width !== Math.round(pw*DPR) || dcv.height !== Math.round(ph*DPR)){ dcv.width = Math.round(pw*DPR); dcv.height = Math.round(ph*DPR); }
  const saved = ctx; ctx = dctx; ctx.setTransform(DPR,0,0,DPR,0,0);
  const bg = ctx.createLinearGradient(0,0,0,ph); bg.addColorStop(0,'#3a0a6e'); bg.addColorStop(1,'#12002b'); ctx.fillStyle = bg; ctx.fillRect(0,0,pw,ph);
  // vanity mirror with bulbs
  const mw = Math.min(pw*0.78, ph*0.7), mx = pw/2, my = ph*0.5;
  ctx.fillStyle = 'rgba(255,255,255,0.06)'; rrect(mx-mw/2, my-mw*0.55, mw, mw*1.1, mw*0.12);
  ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4; ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 12; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(mx-mw/2, my-mw*0.55, mw, mw*1.1, mw*0.12); else ctx.rect(mx-mw/2, my-mw*0.55, mw, mw*1.1); ctx.stroke();
  for (let k=0;k<13;k++){ const a = Math.PI + k/12*Math.PI, bx = mx + Math.cos(a)*(mw/2+12), by = my-mw*0.15 + Math.sin(a)*(mw*0.48), on = 0.5+0.5*Math.sin(t*4+k);
    ctx.fillStyle = `rgba(255,240,180,${0.4+0.6*on})`; ctx.shadowColor = '#ffe9a8'; ctx.shadowBlur = 14*on; ctx.beginPath(); ctx.arc(bx, by, 6, 0, TAU); ctx.fill(); }
  ctx.shadowBlur = 0;
  const fg = ctx.createRadialGradient(pw/2, ph*0.9, 0, pw/2, ph*0.9, mw*0.5); fg.addColorStop(0, LOOKS[curChar].top.color+'66'); fg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.ellipse(pw/2, ph*0.9, mw*0.5, mw*0.12, 0, 0, TAU); ctx.fill();
  drawGirl(CHARS[curChar], LOOKS[curChar], curChar, pw/2, ph*0.92, Math.min(ph*0.74, pw*1.1), t, false);
  for (let i=DSPARK.length-1;i>=0;i--){ const s = DSPARK[i]; s.life -= dt; if (s.life<=0){ DSPARK.splice(i,1); continue; } s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 200*dt;
    ctx.fillStyle = hsl(s.h,100,70,Math.min(1,s.life*2)); ctx.beginPath(); ctx.arc(s.x, s.y, 3+2*s.life, 0, TAU); ctx.fill(); }
  ctx = saved;
}

/* ================= START ================= */
async function start(){
  if (started) return; started = true;
  initAudio(); $('#splash').classList.add('gone'); openDress();
  const el = document.documentElement;
  try { if (el.requestFullscreen && !matchMedia('(display-mode: standalone)').matches) await el.requestFullscreen({navigationUI:'hide'}); } catch(e){}
  try { const wl = await navigator.wakeLock?.request('screen'); document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') navigator.wakeLock?.request('screen').catch(()=>{}); }); } catch(e){}
  setTimeout(resize, 50); setTimeout(resize, 400);
  lastTouch = performance.now();
}
$('#play').addEventListener('pointerdown', e => { e.preventDefault(); start(); });
$('#play').addEventListener('click', start);
document.addEventListener('visibilitychange', () => { if (AC && document.visibilityState==='visible' && AC.state==='suspended') AC.resume(); });

setMusic(musicOn); renderStars(); renderMix(); resize();
requestAnimationFrame(frame);
if (location.search.includes('auto=1')){ window.__kb = {P, ROCKETS, BOOBOPS, BUBBLES, launch, spawnBooBop, explode, addPotion, mix, get glow(){return glow}, get stars(){return starsTotal}, byId, get ac(){return AC},
    LOOKS, CHARS, WARDROBE, applyItem, setColor, setCat, switchChar, surprise, openDress, toStage, get curChar(){return curChar}, get dressOpen(){return dressOpen}};
  start(); if (!location.search.includes('dress=1')) toStage(); if (location.search.includes('mix=')) location.search.match(/mix=([\w,]+)/)[1].split(',').forEach(id=>byId[id]&&addPotion(id)); if (location.search.includes('finale=1')) setTimeout(()=>{ finaleUntil = performance.now()+10000; },300); }
})();
