<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0A4A88">
<link rel="icon" href="data:,">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mike the Mic: Below the Wire</title>
<style>
  /* Helvetica Neue LT Std is MTDCNC's licensed family, but its web-embedding licence is unconfirmed, so no font file is
     bundled. When the licensed .woff2 files are cleared, drop them in assets/fonts/ and uncomment these rules; every
     font stack in the game already names the family first.
  @font-face{font-family:"Helvetica Neue LT Std";font-weight:900;font-stretch:condensed;src:url(assets/fonts/HelveticaNeueLTStd-BlkCn.woff2) format("woff2")}
  @font-face{font-family:"Helvetica Neue LT Std";font-weight:500;src:url(assets/fonts/HelveticaNeueLTStd-Md.woff2) format("woff2")}
  @font-face{font-family:"Helvetica Neue LT Std";font-weight:400;src:url(assets/fonts/HelveticaNeueLTStd-Roman.woff2) format("woff2")}
  */
  :root{--font:"Helvetica Neue LT Std","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;--red:#EB0000;--navy:#002C5A;--blue:#0F579B}
  html,body{margin:0;height:100%;background:#060f18;overflow:hidden;font:600 16px/1.2 var(--font);color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  #stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#0F579B}
  #game{display:block;width:960px;height:540px}
  #loading{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;background:#0F579B}
  #menu{position:absolute;inset:0;pointer-events:none}
  #menu button{pointer-events:auto;position:absolute;font:700 28px var(--font);border:0;border-radius:18px;padding:0 34px;height:64px;cursor:pointer;
    background:var(--red);color:#fff;box-shadow:0 4px 0 #CD0103}
  #menu button:active{transform:translateY(3px);box-shadow:0 1px 0 #CD0103}
  #menu button.alt{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 3px var(--navy),0 4px 0 var(--navy)}
  #menu [data-for]{display:none}
  #menu[data-kind=title] [data-for~=title],#menu[data-kind=results] [data-for~=results]{display:block}
  #menu [data-for][hidden]{display:none}
  #play{left:80px;top:360px}
  #resume-save{left:268px;top:360px}
  #res-continue{left:66px;top:432px}
  #res-replay{left:66px;top:432px}
  #menu a{pointer-events:auto;position:absolute;right:40px;top:50px;font:700 15px var(--font);color:#a9c5d0;text-decoration:none;border-bottom:2px solid #47626d;padding:2px 0}
  #menu a:focus-visible,#menu button:focus-visible{outline:3px solid #ffc46a;outline-offset:3px}
  #pausebox{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,44,90,.6)}
  #pausebox .card{background:#fff;color:var(--navy);border-radius:22px;padding:26px 36px;text-align:center;font:900 34px var(--font);display:grid;gap:12px;min-width:320px}
  #pausebox .score{font:700 20px var(--font);color:#34414F;margin-top:-6px}
  #pausebox button{font:700 22px var(--font);border:0;border-radius:14px;height:54px;padding:0 26px;background:#fff;color:var(--navy);box-shadow:inset 0 0 0 3px var(--navy)}
  #pausebox button#resume{background:var(--red);color:#fff;box-shadow:none}

  /* Touch controls: sized in CSS px (design section 3), inside the safe area, over the letterbox or the floor band. */
  .tc{position:fixed;display:none;width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:rgba(0,44,90,.55);
    color:#fff;touch-action:none;padding:0;box-sizing:border-box;align-items:center;justify-content:center}
  .tc svg{width:30px;height:30px;fill:#fff;pointer-events:none}
  .tc.on{background:rgba(235,0,0,.85);border-color:#fff}
  body.touch[data-mode=play] .tc:not(#tc-fix),body.touch[data-mode=scene] .tc:not(#tc-fix),body.touch[data-mode=play] #tc-fix.show{display:flex}
  #tc-look .dive,#tc-look.wet .look{display:none}#tc-look.wet .dive{display:block}
  #tc-left{left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom))}
  #tc-right{left:calc(88px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom))}
  #tc-look{left:calc(50px + env(safe-area-inset-left));bottom:calc(88px + env(safe-area-inset-bottom))}
  #tc-jump{width:76px;height:76px;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom))}
  #tc-jump svg{width:36px;height:36px}
  #tc-cam{right:calc(100px + env(safe-area-inset-right));bottom:calc(62px + env(safe-area-inset-bottom))}
  #tc-fix{right:calc(18px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom))}
  #pause{position:fixed;display:none;top:calc(8px + env(safe-area-inset-top));left:50%;margin-left:-24px;width:48px;height:48px;border-radius:14px;border:2px solid rgba(255,255,255,.8);
    background:rgba(0,44,90,.7);padding:0;align-items:center;justify-content:center}
  #pause svg{width:22px;height:22px;fill:#fff}
  body[data-mode=play] #pause{display:flex}
  #sound{position:fixed;display:flex;top:calc(8px + env(safe-area-inset-top));left:50%;margin-left:32px;width:48px;height:48px;border-radius:14px;border:2px solid rgba(255,255,255,.8);
    background:rgba(0,44,90,.7);padding:0;align-items:center;justify-content:center}
  #sound svg{width:24px;height:24px;fill:#fff}
  #sound.off .wave{display:none}
  #sound:not(.off) .cross{display:none}
  body[data-mode=loading] #sound,body[data-mode=scene] #sound{display:none}
  #locked{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#0F579B;font:600 22px/1.5 var(--font)}
  #locked a{display:inline-block;margin-top:18px;font:700 22px var(--font);color:#fff;background:var(--red);border-radius:16px;padding:14px 30px;text-decoration:none;box-shadow:0 4px 0 #CD0103}
  #rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:#0F579B;font:700 24px var(--font);padding:24px}
  body.touch.portrait[data-mode=play] #rotate{display:grid}
</style>
</head>
<body data-mode="loading">
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="menu" hidden>
    <button id="play" data-for="title">Play</button>
    <button id="resume-save" class="alt" data-for="title" hidden>Continue</button>
    <button id="res-replay" data-for="results">Play again</button>
    <a href="./" data-for="title">Level 1: The Night Shift</a>
  </div>
  <div id="pausebox" hidden><div class="card">Paused<div class="score" id="pause-score"></div>
    <button id="resume">Resume</button><button id="restart-cp">Back to checkpoint</button><button id="snd-toggle">Sound: on</button><button id="quit">Quit to title</button></div></div>
  <div id="loading">Filling the tanks…</div>
  <div id="locked" hidden><div><b>Level 2 is locked.</b><br>Finish The Night Shift first.<br><a href="./">Back to Level 1</a></div></div>
</div>
<button class="tc" id="tc-left" data-ctl="left" aria-label="Run left"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8z"/></svg></button>
<button class="tc" id="tc-right" data-ctl="right" aria-label="Run right"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8z"/></svg></button>
<button class="tc" id="tc-look" data-ctl="lookDown" aria-label="Hold to look below"><svg class="look" viewBox="0 0 24 24"><path d="M4 5h16v2H4zm8 15L4 11h5V8h6v3h5z"/></svg><svg class="dive" viewBox="0 0 24 24"><path d="M12 21 4 11h5V3h6v8h5z"/></svg></button>
<button class="tc" id="tc-jump" data-ctl="jump" aria-label="Jump, or swim up"><svg viewBox="0 0 24 24"><path d="M12 3 4 13h5v8h6v-8h5z"/></svg></button>
<button class="tc" id="tc-cam" data-ctl="camera" aria-label="Camera: slow the machines"><svg viewBox="0 0 24 24"><path d="M3 7h12a2 2 0 0 1 2 2v1.5L22 7v10l-5-3.5V15a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/></svg></button>
<button class="tc" id="tc-fix" data-ctl="fix" aria-label="Use: turn a valve, or hold to fix"><svg viewBox="0 0 24 24"><path d="M21 7.5 17.5 11 13 6.5 16.5 3A5 5 0 0 0 10 9.2L3 16.2 7.8 21l7-7A5 5 0 0 0 21 7.5z"/></svg></button>
<button id="sound" aria-label="Sound on"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="wave" d="M15 8.5a4.5 4.5 0 0 1 0 7l1.2 1.4a6.3 6.3 0 0 0 0-9.8zM17.8 5.4a8.6 8.6 0 0 1 0 13.2l1.2 1.4a10.4 10.4 0 0 0 0-16z"/><path class="cross" d="m15 9 1.4-1.4 2.1 2.1 2.1-2.1L22 9l-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1L15 13.2l2.1-2.1z"/></svg></button>
<button id="pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></button>
<div id="rotate">Turn your device sideways to play.</div>
<script src="js/puppet.js"></script>
<script src="js/world.js"></script>
<script src="js/art.js"></script>
<script src="js/machines.js"></script>
<script src="js/nightshift.js"></script>
<script src="js/audio.js"></script>
<script src="js/l2-world.js"></script>
<script src="js/l2-art.js"></script>
<script src="js/l2-audio.js"></script>
<script src="js/l2-game.js"></script>
</body>
</html>
