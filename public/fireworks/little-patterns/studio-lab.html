<!--
  "Nook's Messy Studio": the playable lab build of the painting game. It began as a feasibility page and is now LIVE:
  it is on the deploy allow-list (tools/stage-little-patterns.cjs) and linked from Nook's Garden as the Paint tab.
  Drawing lives here (brushes, flick splats, potato stamps, marbles); local scripts supply material sounds and device-only draft storage. Rules: docs/messy-studio-brief.md
  and docs/messy-studio-fable-brief.md.
  ?lab=1    shows the read-out and the Test picture button (hidden for players arriving from Nook's Garden)
  ?seed=N   repeatable splats and marble kinds
  ?demo=1   scripted run for a headless screenshot (sets body[data-done])
  ?roll=N   any TUNE key can be set this way
  With ?lab=1 the read-out is the thing to photograph after flicking marbles on a slow device.
-->
<style>
  :root{--ink:#3b2f4a;--paper:#fffdf6;--bar:#fff6d8;--line:#e6d9a8;--nook:#7b5cc4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;background:var(--bar);color:var(--ink);
    font:600 15px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none}
  #app{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column}
  #bar,#ctx,#palette{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:5px 8px;background:var(--bar)}
  #bar{justify-content:space-between} #ctx{border-bottom:2px solid var(--line);min-height:62px} #palette{border-top:2px solid var(--line);justify-content:center}
  .group{display:flex;gap:5px;align-items:center} #marble-ui{display:contents}
  #home{display:grid;place-items:center;width:52px;height:52px;border:2px solid #846a93;border-radius:16px;background:#eee3f2} #home svg{width:34px;height:34px}
  #app.narrow #home{width:48px;height:48px;border-radius:14px} #app.narrow #home svg{width:30px;height:30px}
  body:not(.lab) .lab-only{display:none!important}
  button{font:inherit;color:inherit;width:52px;height:52px;padding:0;border:2px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;display:grid;place-items:center}
  button svg{width:34px;height:34px;display:block;pointer-events:none}
  button:disabled{opacity:.35;cursor:default}
  button[aria-pressed="true"]{border-color:var(--nook);background:#efe8ff;box-shadow:0 0 0 2px var(--nook) inset}
  label.slide{display:flex;align-items:center;gap:4px} label.slide svg{width:26px;height:26px;flex:none} label.slide output{min-width:30px;font-size:12px;white-space:nowrap}
  input[type=range]{width:120px;height:40px;accent-color:var(--nook)}
  #stage{position:relative;flex:1;min-width:0;min-height:0;background:#efe6c6;overflow:hidden;touch-action:none}
  /* the paper has a fixed size for the life of the picture; only its CSS transform changes */
  #paper{position:absolute;left:50%;top:50%;transform-origin:50% 50%;background:var(--paper);box-shadow:0 1px 8px rgba(80,60,20,.25);
    background-image:radial-gradient(rgba(120,100,60,.05) 1px,transparent 1.2px);background-size:7px 7px;overflow:hidden}
  #paint{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;display:block}
  .marble{position:absolute;top:0;left:0;border-radius:50%;pointer-events:none;will-change:transform;box-shadow:0 3px 6px rgba(40,20,60,.35);animation:pop .28s ease-out}
  @keyframes pop{from{scale:.2;opacity:0}to{scale:1;opacity:1}}
  .puddle{position:absolute;border-radius:50%;pointer-events:none;opacity:.35;transform:scale(.25);transition:transform 1.2s linear}
  .sw{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink);background-clip:padding-box}
  .sw[data-n]::after{content:attr(data-n);display:block;color:#fff;font-size:13px;text-shadow:0 0 3px #000,0 0 2px #000}
  #perf{position:absolute;right:6px;bottom:6px;margin:0;padding:5px 7px;border-radius:10px;background:rgba(40,30,60,.78);color:#fff;
    font:500 10px/1.35 ui-monospace,Menlo,Consolas,monospace;pointer-events:none;white-space:pre-wrap;max-width:74%}
  #perf.docked{position:static;max-width:none;border-radius:0;padding:6px 10px;font-size:11px;border-top:2px solid var(--line);background:#4a4060}
  #app.narrow button{width:48px;height:48px;border-radius:14px} #app.narrow button svg{width:30px;height:30px}
  #app.narrow .group{gap:3px} #app.narrow label.slide svg{width:22px;height:22px}
  #app.narrow #bar,#app.narrow #ctx,#app.narrow #palette{gap:5px;padding:5px 7px} #app.narrow input[type=range]{width:82px} #app.narrow .sw{width:48px;height:48px;border-radius:50%}
  #app.narrow #ctx{min-height:54px}
  #app.narrow #size-ui>span[data-icon]{display:none}
  #stamp-ui button svg,#mine-ui button svg{width:38px;height:38px} #app.narrow #stamp-ui button svg,#app.narrow #mine-ui button svg{width:34px;height:34px}
  #stamp-ui,#mine-ui{flex-wrap:wrap}                 /* on an upright phone the library is wider than the screen: it takes a second row instead of running off the edge */
  #mine-open,#mine-new{border-style:dashed;border-color:#b9a36a;background:#fffaf0}
  /* the stamp maker covers the whole game; its sheet is a square as large as the screen allows */
  #maker{position:absolute;top:0;right:0;bottom:0;left:0;z-index:8;display:flex;flex-direction:column;background:var(--bar)}
  #maker-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;padding:6px 10px;border-bottom:2px solid var(--line)}
  #mine-ui button canvas{width:38px;height:38px;display:block;pointer-events:none} #app.narrow #mine-ui button canvas{width:34px;height:34px}
  #app.narrow #maker-bar button{width:48px;height:48px;border-radius:14px} #app.narrow #maker-bar button svg{width:32px;height:32px}
  #maker-bar button{width:60px;height:60px;border-radius:18px} #maker-bar button svg{width:40px;height:40px} #maker-save{border-color:#6f9a3a;background:#f1f8e4}
  #maker-stage{flex:1;min-height:0;display:grid;place-items:center;background:#efe6c6;touch-action:none}
  #maker-canvas{display:block;touch-action:none;border-radius:18px;background:var(--paper);background-image:radial-gradient(rgba(120,100,60,.05) 1px,transparent 1.2px);background-size:7px 7px;box-shadow:0 1px 8px rgba(80,60,20,.25);outline:3px dashed #d9c78e;outline-offset:-10px;cursor:crosshair}
  @media (orientation:landscape) and (max-height:560px){#maker{flex-direction:row}#maker-bar{flex-direction:column;border-bottom:0;border-right:2px solid var(--line)}#maker-bar .group{flex-direction:column}}
  /* A phone on its side has almost no height: the controls go down the sides and the sheet gets all of it. */
  @media (orientation:landscape) and (max-height:560px){
    #app{flex-direction:row}
    #bar,#ctx,#palette{flex-direction:column;flex-wrap:wrap;align-content:flex-start;justify-content:flex-start;height:100%}
    #bar .group,#ctx .group{display:contents}
    #ctx,#app.narrow #ctx{min-height:0;border-bottom:0;border-right:2px solid var(--line)} #palette{border-top:0;border-left:2px solid var(--line)}
    #ctx,#app.narrow #ctx{width:64px;flex:none;align-items:center}
    #ctx:has(#stamp-ui:not([hidden])),#app.narrow #ctx:has(#stamp-ui:not([hidden])),#ctx:has(#mine-ui:not([hidden])),#app.narrow #ctx:has(#mine-ui:not([hidden])){width:auto;max-width:132px}   /* the stamp library needs two columns on a phone held sideways */
    #size-ui{flex-direction:column;width:48px;gap:0} #size-ui>span[data-icon]{display:none}
    #app.narrow #size-ui input,#size-ui input{width:82px;height:40px;transform:rotate(-90deg);margin:23px -17px}
    #perf.docked{position:absolute;right:104px;bottom:6px;min-height:0!important;max-width:45%;border-radius:10px;border:0}
  }
  [hidden]{display:none!important}
  button:focus-visible,a:focus-visible{outline:3px solid var(--nook);outline-offset:3px}
  #size-preview{width:28px;height:28px;display:grid;place-items:center;flex:none}
  #size-preview i{display:block;border-radius:50%;background:var(--nook)}
  #draft-status{position:absolute;bottom:8px;left:8px;right:8px;margin:0;padding:8px 12px;background:#fff6d8;border:2px solid var(--line);border-radius:14px;text-align:center;font-size:14px;pointer-events:none}
  #export-panel{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(40,30,45,.4);z-index:10;display:grid;place-items:center;padding:16px}
  #export-card{background:var(--paper);padding:20px;border-radius:24px;border:3px solid var(--line);max-width:650px;width:100%;max-height:95%;overflow:auto;text-align:center}
  #export-card h2{margin:0 0 12px;font-size:24px} #export-image{width:100%;max-height:52vh;object-fit:contain;-webkit-touch-callout:default;user-select:auto}
  #export-card .group{justify-content:center;flex-wrap:wrap;margin:12px 0}
  #export-card button,#export-card a{width:auto;min-width:110px;min-height:48px;padding:10px 18px;border:2px solid var(--line);border-radius:14px;color:var(--ink);background:#efe8ff;text-decoration:none;display:inline-grid;place-items:center}
  #export-card p{font-weight:400;font-size:15px} @media(prefers-reduced-motion:reduce){.marble{animation:none}.puddle{transition:none}}
</style>

<body>
<div id="app">
  <div id="bar">
    <div class="group" id="tools">
      <a id="home" href="garden.html" data-icon="back" aria-label="Back to Nook's Garden"></a>
      <button data-tool="brush" data-icon="brush" aria-label="Brush" aria-pressed="true"></button>
      <button data-tool="eraser" data-icon="rubber" aria-label="Rubber"></button>
      <button data-tool="flick" data-icon="flick" aria-label="Flick paint"></button>
      <button data-tool="stamp" data-icon="stamp" aria-label="Potato stamps"></button>
      <button data-tool="marbles" data-icon="marbles" aria-label="Add a marble"></button>
    </div>
    <div class="group">
      <button id="sound" aria-label="Sound on. Tap to mute." aria-pressed="true"></button>
      <button id="undo" data-icon="undo" aria-label="Undo"></button>
      <button id="redo" data-icon="redo" aria-label="Redo" disabled></button>
      <button id="new" data-icon="newpage" aria-label="New picture"></button>
      <button id="save" data-icon="save" aria-label="Save a picture"></button>
      <button id="fit" data-icon="fit" aria-label="Show the whole sheet" hidden></button>
      <button id="test" class="lab-only" data-icon="test" aria-label="Test picture (lab only)"></button>
    </div>
  </div>
  <div id="ctx">
    <div class="group" id="brush-ui" aria-label="Brush type">
      <button data-brush="round" data-icon="bRound" aria-label="Round brush" aria-pressed="true"></button>
      <button data-brush="flat" data-icon="bFlat" aria-label="Flat brush"></button>
      <button data-brush="crayon" data-icon="bCrayon" aria-label="Crayon"></button>
      <button data-brush="sponge" data-icon="bSponge" aria-label="Sponge"></button>
    </div>
    <div class="group" id="stamp-ui" aria-label="Stamp shape" hidden></div>
    <div class="group" id="mine-ui" aria-label="My own stamps" hidden></div>
    <div class="group" id="marble-ui" hidden>
      <button id="away" data-icon="away" aria-label="Clear all the marbles"></button>
    </div>
    <label class="slide" id="size-ui"><span data-icon="size"></span><input id="size" type="range" min="0" max="1" step="0.01" value="0.4" aria-label="Size"><span id="size-preview" aria-hidden="true"><i></i></span></label>
  </div>
  <div id="stage"><div id="paper"><canvas id="paint"></canvas></div><pre id="perf" class="lab-only"></pre><p id="draft-status" role="status" hidden></p></div>
  <div id="palette" aria-label="Colours"></div>
  <div id="maker" role="dialog" aria-modal="true" aria-label="Make your own stamp. Draw a shape; every line joins up and fills in." hidden>
    <div id="maker-bar"><button id="maker-close" aria-label="Go back without saving"></button><div class="group" id="maker-pens" role="group" aria-label="Pens"><button data-pen="draw" aria-label="Draw. A line that comes back to its start fills in." aria-pressed="true"></button><button data-pen="cut" aria-label="Remove. A loop cuts a hole, a line rubs a line out." aria-pressed="false"></button></div><div class="group"><button id="maker-undo" aria-label="Take back the last line" disabled></button><button id="maker-clear" aria-label="Start again" disabled></button><button id="maker-fit" data-icon="fit" aria-label="Show the whole stamp" hidden></button></div><button id="maker-save" aria-label="Save my stamp" disabled></button></div>
    <div id="maker-stage"><canvas id="maker-canvas" aria-label="Draw your stamp here"></canvas></div>
  </div>
</div>
<div id="export-panel" role="dialog" aria-modal="true" aria-labelledby="export-title" hidden>
  <div id="export-card"><h2 id="export-title">Your picture</h2><img id="export-image" alt="Your painting, ready to save" hidden>
    <p id="export-note" role="status">Getting your picture ready…</p>
    <div class="group"><button id="share-picture" hidden>Share picture</button><a id="download-picture" download="my-painting.png" hidden>Save picture</a><button id="close-export">Back to painting</button></div>
  </div>
</div>
<script src="assets/studio-sounds/bank.js?v=2d6f4bca339f"></script>

<script>
(() => {
'use strict';
const QS = new URLSearchParams(location.search), TAU = Math.PI * 2;
const $ = s => document.querySelector(s), clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const app = $('#app'), stage = $('#stage'), paper = $('#paper'), paint = $('#paint'), ctx = paint.getContext('2d'), perfEl = $('#perf');
let soundState='on';
const sound = window.StudioSounds && window.StudioSoundBank ? new StudioSounds.Engine({onState:state=>{soundState=state;showSound();}}) : null;
['pointerdown','pointerup','touchend','click','keydown'].forEach(type=>document.addEventListener(type,e=>{if(!e.target.closest('#sound'))sound?.unlock();},{capture:true,passive:true}));
const COLOURS = ['#e5383b','#f3722c','#f9c74f','#a7c957','#2a9d4a','#1fa39a','#4cc9f0','#2f5fd0',
                 '#7b5cc4','#c9379d','#ff8fab','#8a5a3b','#2b2430','#8d8a94','#ffffff','#ffd6a5'];
let W = 0, H = 0, DPR = 1, unit = 1;                 // the sheet's size in its own pixels; unit scales every mark to the sheet

/* ---------- seeded randomness: every splat differs, a given seed repeats exactly ---------- */
let seed = (QS.get('seed') | 0) || ((Date.now() & 0x7fffffff) | 1);
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;

/* ---------- icons: every control is a picture; the words live in aria-label ---------- */
const I = (body, extra = '') => `<svg viewBox="0 0 32 32" fill="none" stroke="#3b2f4a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ${extra} aria-hidden="true">${body}</svg>`;
const ball = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#9fc3e6" stroke-width="2"/><circle cx="${x - r * .35}" cy="${y - r * .35}" r="${r * .28}" fill="#fff" stroke="none"/>`;
const ICONS = {
  brush: I('<path d="M27 5 16 16" stroke="#8a5a3b" stroke-width="4.5"/><path d="M16.5 15.5c-3.2-1.3-7.5.8-8 5-.3 2.6-2 3.7-4.2 4.2 4.2 2.6 10 1.6 12.6-2.1 1.6-2.3 1.4-5.2-.4-7.1z" fill="#2f5fd0" stroke="none"/>'),
  rubber: I('<g transform="rotate(-35 16 16)"><rect x="4" y="10" width="24" height="12" rx="3" fill="#ff8fab"/><rect x="4" y="10" width="9" height="12" rx="3" fill="#6f8be0"/></g><path d="M6 28h9" stroke-width="2"/>'),
  flick: I('<path d="M20 6c3-1 4.5 2 7 2.5 1.8.4 1.5 3.500-.5 4 2.5 2 1.5 5.500-1 5.5.5 3-3 4.500-5 2.500-2 2.500-6 1.500-6-1.500-3 .500-4.500-3-2.500-5-2-2.500.500-5.500 3-4.500.500-2.500 3.500-4 5-3.500z" fill="#e5383b" stroke="none"/><circle cx="28.5" cy="24" r="1.8" fill="#f9c74f" stroke="none"/><circle cx="10" cy="6" r="1.6" fill="#2f5fd0" stroke="none"/><circle cx="23" cy="29" r="1.4" fill="#2a9d4a" stroke="none"/><path d="M3 27l7-5M2 20l5-2M9 30l4-4"/>'),
  stamp: I('<path d="M6 17c-1-8 6-13 13-12 7 0 11 6 10 13-1 6-6 10-12 10-7 0-11-4-11-11z" fill="#d9b27a" stroke="#8a5a3b"/><path d="M17 8.5l1.9 4 4.4.4-3.3 3 1 4.3-3.9-2.3-3.9 2.3 1-4.3-3.3-3 4.4-.4z" fill="#fff6d8" stroke="none"/><path d="M22 27l4 3M25 25l4 2" stroke="#8a5a3b"/>'),
  marbles: I(ball(9, 22, 6) + ball(21, 22, 6) + ball(13, 11, 6) + '<path d="M26 3v8M22 7h8" stroke="#2a9d4a" stroke-width="3"/>'),
  away: I(ball(9, 22, 6) + ball(21, 22, 6) + ball(15, 11, 6) + '<path d="M5 5l22 22M27 5 5 27" stroke="#e5383b" stroke-width="3.6"/>'),
  back: I('<path d="M14 6 4 16l10 10"/><path d="M5 16h23"/>', 'stroke-width="3.2"'),
  undo: I('<path d="M11 7 4 13l7 6"/><path d="M5 13h13a7.5 7.5 0 0 1 0 15h-6"/>', 'stroke-width="3"'),
  redo: I('<path d="m21 7 7 6-7 6"/><path d="M27 13H14a7.5 7.5 0 0 0 0 15h6"/>', 'stroke-width="3"'),
  save: I('<path d="M6 20v8h20v-8"/><path d="M16 3v17m-6-6 6 6 6-6" stroke-width="3"/>'),
  newpage: I('<path d="M8 3h11l6 6v20H8z" fill="#fff"/><path d="M19 3v6h6"/><path d="M16.5 14v9M12 18.5h9" stroke="#2a9d4a" stroke-width="3"/>'),
  fit: I('<path d="M5 12V5h7M27 12V5h-7M5 20v7h7M27 20v7h-7" stroke-width="3"/><rect x="11" y="12" width="10" height="8" rx="1.5" fill="#fff" stroke-width="2"/>'),
  test: I('<path d="M4 9c6-5 10 5 24 0" stroke="#f3722c" stroke-width="4"/><path d="M4 16c6-5 10 5 24 0" stroke="#1fa39a" stroke-width="4"/><path d="M4 23c6-5 10 5 24 0" stroke="#c9379d" stroke-width="4"/>'),
  play: I('<path d="M11 6l15 10-15 10z" fill="#7b5cc4" stroke="#7b5cc4"/>'), stop: I('<rect x="8" y="8" width="16" height="16" rx="3" fill="#7b5cc4" stroke="#7b5cc4"/>'),
  bRound: I('<path d="M5 21c6-14 10 8 22-9" stroke="#2f5fd0" stroke-width="6.5"/>'),
  bFlat: I('<path d="M3 24c6-14 10 8 22-9l4-4c-12 17-16-5-22 9z" fill="#2f5fd0" stroke="#2f5fd0" stroke-width="1"/>'),
  bCrayon: I('<path d="M5 21c6-14 10 8 22-9" stroke="#2f5fd0" stroke-width="7" stroke-linecap="butt" stroke-dasharray="1.3 1.5"/><path d="M5 22.5c6-14 10 8 22-9" stroke="#2f5fd0" stroke-width="3" stroke-linecap="butt" stroke-dasharray="2.2 1.1"/>'),
  bSponge: I([[9,12,4],[16,9,3.5],[23,12,4],[7,19,3],[13,18,4.5],[20,19,4],[26,20,2.5],[11,25,3],[18,26,3.5],[24,26,2.5]].map(c => `<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="#2f5fd0" stroke="none"/>`).join('')),
  size: I('<circle cx="7" cy="20" r="3" fill="#3b2f4a"/><circle cx="21" cy="16" r="8" fill="#3b2f4a"/>')
};
if (QS.has('lab') || QS.has('demo')) document.body.classList.add('lab');
/* Controls answer the finger LIFTING on them, not the browser's "click": Android Chrome swallows the click of a tap that follows
   a fast flick on the sheet (it reads the tap as "stop the fling"), so after flicking paint or a marble the next tap on a tool
   often did nothing. A real click (keyboard, assistive tech) still works; one that merely echoes a handled lift is ignored. */
let lastHandledPress=-Infinity;
document.addEventListener('click',e=>{if(e.detail>0&&performance.now()-lastHandledPress<600){lastHandledPress=-Infinity;e.preventDefault();e.stopImmediatePropagation();}},true);
function onPress(root, handler){ let downOn = null; const pick = e => e.target.closest ? e.target.closest('button,a') : null;
  root.addEventListener('pointerdown', e => { downOn = pick(e); });
  root.addEventListener('pointerup', e => { const b = pick(e); if (b && b === downOn && !b.disabled){ lastHandledPress = performance.now(); handler(e, b); } downOn = null; });
  root.addEventListener('pointercancel', () => { downOn = null; });
  root.addEventListener('click', e => {const b = pick(e); if (b && !b.disabled) handler(e, b); }); }
const setIcon = (el, name) => { el.innerHTML = ICONS[name]; };
function showSound(){
  const muted=sound?.muted,unavailable=!sound||soundState==='unavailable',b=$('#sound');
  b.innerHTML=I('<path d="M5 12h6l7-6v20l-7-6H5z" fill="#c7dcca"/>'+(muted?'<path d="m23 12 6 8m0-8-6 8"/>':'<path d="M23 11q5 5 0 10M26 7q8 9 0 18"/>'));
  b.setAttribute('aria-pressed',String(!muted&&!unavailable));
  b.setAttribute('aria-label',unavailable?'Sound unavailable. Tap to retry.':muted?'Sound off. Tap to turn on.':'Sound on. Tap to mute.');
  b.title=b.getAttribute('aria-label');
}
onPress($('#sound'),()=>{if(!sound)return;if(soundState==='unavailable'){sound.unlock(true);return;}sound.setMuted(!sound.muted);});
showSound();
document.querySelectorAll('[data-icon]').forEach(el => setIcon(el, el.dataset.icon));
onPress($('#home'), (e,a)=>{e.preventDefault();leaveStudio(a.href);});

/* ---------- the sheet of paper ----------
   ONE sheet size on every device, for the whole life of a picture: SHEET_W x SHEET_H bitmap pixels. It is never re-made to suit
   a screen and never re-drawn on a resize (that is what shrank the picture in the first lab). What dictates the size is the
   weakest target: the iPad 5 and Safari's cap on canvas memory. 1600x1200 is 7.7 MB, and the sheet plus four Undo copies is
   about 38.4 MB at rest (one extra temporary snapshot during a gesture or history swap). Every mark is sized in sheet pixels.

   The view is only a CSS transform of that bitmap:
     turn   the sheet behaves like real paper lying on the device: when the device is turned, the sheet turns with it
            and its long side stays along the device's long side. The browser's orientation angle is used when it has
            one; when it has not, the shape of the space decides. Nothing here needs a lock, a sensor or an install.
     zoom   two fingers pinch and carry the sheet (mouse: wheel). Zoom 1 shows the whole sheet, so pinching all the way
            out is always the way home. Pinch and carry are the only ways to move around the sheet. */
const SHEET_W = 1600, SHEET_H = 1200, ZMAX = 5;
const GEO = {cx:0, cy:0, sw:1, sh:1, fit:1, s:1}, VIEW = {z:1, tx:0, ty:0, r:0};
const mod = a => ((a % 360) + 360) % 360;

let A0 = null, R0 = null;
function newPaper(){
  putAway(); W = SHEET_W; H = SHEET_H; DPR = 1; unit = Math.min(W, H) / 700; undoStack.length = 0;
  paper.style.width = W + 'px'; paper.style.height = H + 'px'; paint.width = W; paint.height = H;
}
function place(){
  app.classList.toggle('narrow', Math.min(window.innerWidth, window.innerHeight) < 560);

  const b = stage.getBoundingClientRect(), A = rawAngle(); GEO.sw = Math.max(50, b.width); GEO.sh = Math.max(50, b.height); GEO.cx = b.left + b.width / 2; GEO.cy = b.top + b.height / 2;
  if (R0 == null){ R0 = GEO.sw >= GEO.sh ? 0 : 90; A0 = A; }                                  // how the sheet first lay on the device
  VIEW.r = (A == null || A0 == null) ? (GEO.sw >= GEO.sh ? 0 : 90) : mod(R0 - (A - A0));       // device turned one way = sheet turns the other way in the window, i.e. stays put on the glass
  const odd = VIEW.r % 180 !== 0; GEO.fit = Math.min(GEO.sw / (odd ? H : W), GEO.sh / (odd ? W : H)); applyView();
}
function applyView(){
  const odd = VIEW.r % 180 !== 0, sc = GEO.fit * VIEW.z, mx = Math.max(0, (odd ? H : W) * sc / 2 - GEO.sw / 2), my = Math.max(0, (odd ? W : H) * sc / 2 - GEO.sh / 2);
  VIEW.tx = clamp(VIEW.tx, -mx, mx); VIEW.ty = clamp(VIEW.ty, -my, my); GEO.s = sc;            // the sheet can never be carried off the screen
  paper.style.transform = `translate(-50%,-50%) translate(${VIEW.tx}px,${VIEW.ty}px) rotate(${VIEW.r}deg) scale(${sc})`;

}
function toSheet(sx, sy){ const a = -VIEW.r * Math.PI / 180, c = Math.cos(a), n = Math.sin(a), dx = sx - GEO.cx - VIEW.tx, dy = sy - GEO.cy - VIEW.ty;

function toScreen(x, y){ const a = VIEW.r * Math.PI / 180, c = Math.cos(a), n = Math.sin(a), qx = (x - W / 2) * GEO.s, qy = (y - H / 2) * GEO.s;

onPress($('#fit'), () => { VIEW.z = 1; VIEW.tx = VIEW.ty = 0; applyView(); });
stage.addEventListener('wheel', e => { e.preventDefault();                                     // mouse wheel or trackpad pinch zooms about the cursor; a trackpad two-finger slide carries the sheet
  const zoomy = e.ctrlKey || e.deltaMode === 1 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 40);
  if (zoomy) zoomTo(VIEW.z * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)), toSheet(e.clientX, e.clientY), e.clientX, e.clientY);
  else { VIEW.tx -= e.deltaX; VIEW.ty -= e.deltaY; applyView(); } }, {passive:false});
let layT = 0; const relayout = () => { place(); clearTimeout(layT); layT = setTimeout(place, 250); };      // once now, once after the browser's own rotation animation settles
addEventListener('resize', relayout); addEventListener('orientationchange', relayout); if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', relayout);
const css = () => ctx.setTransform(DPR, 0, 0, DPR, 0, 0), dev = () => ctx.setTransform(1, 0, 0, 1, 0, 0);

/* Four history slots shared by Undo/Redo; tiny carried-paint copies are part of each action. */
const undoStack = [], redoStack = [], undoPool = [];
function releaseSnapshot(c){if(c.marbles)for(const m of c.marbles){m.load.width=m.load.height=1;}c.marbles=[];undoPool.push(c);}
function captureState(){
  const c = undoPool.pop() || document.createElement('canvas');
  if (c.width !== paint.width || c.height !== paint.height){ c.width = paint.width; c.height = paint.height; }
  const k = c.getContext('2d'); k.clearRect(0, 0, c.width, c.height); k.drawImage(paint, 0, 0);
  c.marbles=M.list.map(m=>{const load=document.createElement('canvas');load.width=load.height=m.P;load.getContext('2d').drawImage(m.load,0,0);
    return {kind:m.kind,x:m.x,y:m.y,load};});c.seed=seed;c.cycle=S.cycle;c.blank=sheetBlank;return c;
}
function historyButtons(){while(undoStack.length+redoStack.length+undoPool.length>4){const c=undoPool.pop();c.width=c.height=1;}$('#undo').disabled=!undoStack.length;$('#redo').disabled=!redoStack.length;}

function beginUndo(o){o.before=captureState();o.undo=true;}

function cancelUndo(o){if(!o.before)return;restoreState(o.before);releaseSnapshot(o.before);o.before=null;historyButtons();}
function restoreState(c){putAway();dev();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,paint.width,paint.height);ctx.drawImage(c,0,0);
  for(const saved of c.marbles){const m=makeMarble(saved.kind,saved.x,saved.y);m.el.style.animation='none';m.lctx.drawImage(saved.load,0,0);}seed=c.seed;S.cycle=c.cycle;sheetBlank=c.blank;historyButtons();}
function clearGestures(){for(const o of ptrs.values()){if(o.el)o.el.remove();if(o.tool==='stamp')endStamp(o);else if(o.tool==='brush'||o.tool==='eraser')finishStroke(o,{x:o.lx,y:o.ly});commitUndo(o);}ptrs.clear();TP.clear();NAV.on=false;paint.style.cursor='';}
function moveHistory(from,to){sound?.stop();haltMarbles();clearGestures();if(!from.length)return;const previous=from.pop(),current=captureState();restoreState(previous);releaseSnapshot(previous);to.push(current);historyButtons();changed();}
function undo(){moveHistory(undoStack,redoStack);}
function redo(){moveHistory(redoStack,undoStack);}
function popUndo(){const c=undoStack.pop();if(!c)return;restoreState(c);releaseSnapshot(c);historyButtons();changed();}

const pal = $('#palette');

    if (i >= 0){ if (S.bucket.length > 1) S.bucket.splice(i, 1); } else { S.bucket.push(c); if (S.bucket.length > 8) S.bucket.shift(); } }   // ninth colour nudges the oldest out: never an error

/* ---------- splats: one irregular blob + tapered streaks + droplets, all generated, batched into one path per colour ---------- */
function blob(p, cx, cy, R, elong, ang, spiky){
  const n = 12 + (rnd() * 5 | 0), ca = Math.cos(ang), sa = Math.sin(ang), pts = [];
  for (let i = 0; i < n; i++){ const t = i / n * TAU + (rnd() - .5) * .25; let r = R * (.8 + rnd() * .3); if (rnd() < spiky) r *= 1.25 + rnd() * .7;
    const x = Math.cos(t) * r * elong, y = Math.sin(t) * r; pts.push(cx + x * ca - y * sa, cy + x * sa + y * ca); }
  p.moveTo((pts[2*n-2] + pts[0]) / 2, (pts[2*n-1] + pts[1]) / 2);
  for (let i = 0; i < n; i++){ const j = (i + 1) % n; p.quadraticCurveTo(pts[2*i], pts[2*i+1], (pts[2*i] + pts[2*j]) / 2, (pts[2*i+1] + pts[2*j+1]) / 2); }
  p.closePath();
}
function streak(p, tx, ty, hx, hy, rh){                // a lobe: wide where it leaves the blob, a pinched neck, a round bead at the end (same winding as blob(), so overlaps never punch holes)
  const a = Math.atan2(hy - ty, hx - tx), nx = Math.cos(a - Math.PI/2), ny = Math.sin(a - Math.PI/2), wb = rh * 2.1, wn = rh * .38, qx = tx + (hx - tx) * .62, qy = ty + (hy - ty) * .62;
  p.moveTo(tx + nx * wb, ty + ny * wb); p.quadraticCurveTo(qx + nx * wn, qy + ny * wn, hx + nx * rh, hy + ny * rh);
  p.arc(hx, hy, rh, a - Math.PI/2, a + Math.PI/2, false); p.quadraticCurveTo(qx - nx * wn, qy - ny * wn, tx - nx * wb, ty - ny * wb); p.closePath();
}
function drop(p, x, y, rx, ry, a){ p.moveTo(x + Math.cos(a) * rx, y + Math.sin(a) * rx); p.ellipse(x, y, rx, ry, a, 0, TAU); }
function splat(x, y, dx, dy, speed, holdMs, cols){

  blob(P(main), cx - dx * R * .5 * e + gauss() * R * .2, cy - dy * R * .5 * e + gauss() * R * .2, R * .62, 1 + e, ang + gauss() * .3, .25);

function dribble(x, y, speedN){sheetBlank=false;css(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.fillStyle = S.bucket[rnd() * S.bucket.length | 0];

/* ---------- pointers: one finger paints; a second touch navigates the paper ---------- */
const ptrs = new Map();
const pos = e => { const q = toSheet(e.clientX, e.clientY); q.t = performance.now(); return q; };      // screen point -> sheet point, however the sheet is turned and zoomed
const TP = new Map(), NAV = {on:false, d0:1, z0:1, q0:null};
const twoPts = () => { const [a, b] = [...TP.values()]; return {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) || 1}; };

function startNav(){                                   // a second finger has landed: whatever the first finger had begun was the start of a pinch, not a mark
  sound?.stop();
  for (const o of ptrs.values()){ if (o.el) o.el.remove(); if (o.marble){ o.marble.held = null; o.marble.vx = o.marble.vy = 0; } if (o.tool === 'stamp') endStamp(o);
    if(o.before){if(performance.now()-o.t0<350||o.moved*GEO.s<18)cancelUndo(o);else{if(o.tool==='brush'||o.tool==='eraser')finishStroke(o,{x:o.lx,y:o.ly});commitUndo(o);changed();}} }
  ptrs.clear(); paint.style.cursor = ''; NAV.on = true; navBase(); }

  e.preventDefault(); try { stage.setPointerCapture(e.pointerId); } catch(_){}
  if (e.pointerType === 'touch'){ TP.set(e.pointerId, {x: e.clientX, y: e.clientY}); if (TP.size >= 2){ if (NAV.on) navBase(); else startNav(); return; } if (NAV.on) return; }

  const o = {tool:S.tool, brush:S.tool === 'brush' ? S.brush : 'round',colour:S.colour,size:S.size[S.tool], x0:p.x, y0:p.y, t0:p.t, lx:p.x, ly:p.y, mx:p.x, my:p.y, moved:0, acc:0, samples:[p], el:null};

  beginUndo(o);

    d.style.cssText = `width:${s}px;height:${s}px;left:${p.x - s/2}px;top:${p.y - s/2}px;background:${S.bucket[S.cycle % S.bucket.length]}`;
    paper.appendChild(d); o.el = d; requestAnimationFrame(() => requestAnimationFrame(() => d.style.transform = 'scale(1)')); }   // the growing puddle shows what holding will do

});
stage.addEventListener('pointermove', e => {

});
const up = e => { if (TP.delete(e.pointerId) && NAV.on){ if (!TP.size) NAV.on = false; else if (TP.size >= 2) navBase(); return; }   // painting only starts again once every finger has lifted

  for (const m of M.list){ const d = Math.hypot(m.x - p.x, m.y - p.y), reach = generous ? Math.max(m.r * 2.2, 44 / GEO.s) : Math.max(m.r * 1.25, 24 / GEO.s); if (!m.held && d < reach && d < bd){ best = m; bd = d; } }
  return best; }
function smearRead(m){                                 // step 2: one copy of the sheet under this frame's track
  const P = m.P, h = P / 2, p = m.path, room = m.scratch.width; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < p.length; i += 3){ const tx = Math.round(p[i] - h), ty = Math.round(p[i + 1] - h);                    // whole sheet pixels: no resampling blur
    if (Math.max(x1, tx) - Math.min(x0, tx) + P > room || Math.max(y1, ty) - Math.min(y0, ty) + P > room){ p.length = i; break; }   // a track too long for the scratch is simply cut short
    p[i] = tx; p[i + 1] = ty; x0 = Math.min(x0, tx); y0 = Math.min(y0, ty); x1 = Math.max(x1, tx); y1 = Math.max(y1, ty); }
  if (!p.length) return; m.bx = x0; m.by = y0; const bw = x1 - x0 + P, bh = y1 - y0 + P, s = m.sctx;
  const cx0 = Math.max(0, x0), cy0 = Math.max(0, y0), cx1 = Math.min(W, x0 + bw), cy1 = Math.min(H, y0 + bh);             // clipped by hand: old WebKit drew nothing when the source rect left the canvas
  s.clearRect(0, 0, bw, bh); if (cx1 > cx0 && cy1 > cy0) s.drawImage(paint, cx0, cy0, cx1 - cx0, cy1 - cy0, cx0 - x0, cy0 - y0, cx1 - cx0, cy1 - cy0);
}
function smearWrite(m){                                // step 3: writes only
  const P = m.P, h = P / 2, p = m.path, l = m.lctx, R = m.r * .9; if (!p.length) return; let dist = 0; for (let i = 2; i < p.length; i += 3) dist += p[i];
  l.globalCompositeOperation = 'destination-out'; l.globalAlpha = 1 - Math.exp(-dist / (TUNE.fadePx * unit)); l.fillRect(0, 0, P, P);          // the load slowly runs dry
  l.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.beginPath(); for (let i = 0; i < p.length; i += 3){ ctx.moveTo(p[i] + h + R, p[i + 1] + h); ctx.arc(p[i] + h, p[i + 1] + h, R, 0, TAU); } ctx.clip();   // the track: a chain of circles
  ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = TUNE.wipe; ctx.fillRect(m.bx, m.by, m.scratch.width, m.scratch.width);      // a marble leaves a slightly thinner track
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = TUNE.deposit;
  for (let i = 0; i < p.length; i += 3){
    l.globalAlpha = 1 - Math.exp(-p[i + 2] / (TUNE.pickupPx * unit)); l.drawImage(m.scratch, p[i] - m.bx, p[i + 1] - m.by, P, P, 0, 0, P, P);   // wet paint ahead replaces the load; bare paper leaves it alone
    ctx.drawImage(m.load, 0, 0, P, P, p[i], p[i + 1], P, P); PERF.steps++; }
  ctx.restore(); p.length = 0;
}
function edgeSound(m,axis,speed,contacts){const key='edge-'+m.id+'-'+axis+(m[axis]<m.r?'low':'high');contacts.add(key);
  if(!m.held&&!M.contacts.has(key)&&!m.edgeTick?.has(key)){sound?.contact(acoustic(m),traySound,speed/unit,key);if(!m.edgeTick)m.edgeTick=new Set();m.edgeTick.add(key);}}
function tick(now){
  const w0 = performance.now(), dt = Math.min(.034, (now - M.last) / 1000) || .016; perfFrame(now - M.last); M.last = now; dev();
  const contacts=new Set();
  for (const m of M.list){                                                                                                   // step 1: physics, and where marks are due
    m.audioX=m.x;m.audioY=m.y;
    if (m.held){const dx=m.held.x-m.x,dy=m.held.y-m.y;if(Math.hypot(dx,dy)<=.25){m.vx=m.vy=0;}else{const k=.55/dt,lim=3200*unit;m.vx=clamp(dx*k,-lim,lim);m.vy=clamp(dy*k,-lim,lim);}}
    else if (m.vx || m.vy){ const f = Math.exp(-TUNE.fric * dt / Math.sqrt(m.w)); m.vx *= f; m.vy *= f;                                                  // a heavy marble keeps rolling for longer
      const v = Math.hypot(m.vx, m.vy), drag = TUNE.roll * unit * dt, cap = TUNE.topV * unit * m.gain;
      if (v <= drag + 4 * unit){ m.vx = m.vy = 0; } else { const k = Math.min(1, cap / v) * (1 - drag / v); m.vx *= k; m.vy *= k; } }
    const sp = Math.hypot(m.vx, m.vy); m.path.length = 0; if (!sp) continue;
    const gap = Math.max(2, m.r * Q.gap[Q.level]), n = Math.max(1, Math.ceil(sp * dt / gap));
    for (let i = 0; i < n; i++){
      m.x += m.vx * dt / n; m.y += m.vy * dt / n;
      if(m.x<m.r||m.x>W-m.r)edgeSound(m,'x',Math.abs(m.vx),contacts);
      if(m.y<m.r||m.y>H-m.r)edgeSound(m,'y',Math.abs(m.vy),contacts);
      if (m.x < m.r){ m.x = m.r; m.vx = Math.abs(m.vx) * m.bounce; } else if (m.x > W - m.r){ m.x = W - m.r; m.vx = -Math.abs(m.vx) * m.bounce; }
      if (m.y < m.r){ m.y = m.r; m.vy = Math.abs(m.vy) * m.bounce; } else if (m.y > H - m.r){ m.y = H - m.r; m.vy = -Math.abs(m.vy) * m.bounce; }
      const moved = Math.hypot(m.x - m.sx, m.y - m.sy); if (moved >= gap * .9){ m.path.push(m.x, m.y, moved); m.sx = m.x; m.sy = m.y; }
    }
  }
  for (let i = 0; i < M.list.length; i++) for (let j = i + 1; j < M.list.length; j++){                    // marbles knock each other; the heavy one shoves the light one
    const a = M.list[i], b = M.list[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
    const key='pair-'+a.id+'-'+b.id;if(d<min+1)contacts.add(key);
    if (d > 0 && d < min){ const nx = dx / d, ny = dy / d, wa = a.held ? 1e6 : a.w, wb = b.held ? 1e6 : b.w, push = min - d;
      a.x -= nx * push * wb / (wa + wb); a.y -= ny * push * wb / (wa + wb); b.x += nx * push * wa / (wa + wb); b.y += ny * push * wa / (wa + wb);
      const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (rel < 0){ const j2 = -(1 + (a.bounce + b.bounce) / 2) * rel / (1 / wa + 1 / wb);
        if(!M.contacts.has(key))sound?.contact(acoustic(a),acoustic(b),-rel/unit,key);
        if (!a.held){ a.vx -= j2 / wa * nx; a.vy -= j2 / wa * ny; } if (!b.held){ b.vx += j2 / wb * nx; b.vy += j2 / wb * ny; } } } }
  for (const m of M.list) if (m.path.length) smearRead(m);                                                  // every read of the sheet happens here, before any write
  for (const m of M.list) if (m.path.length) smearWrite(m);
  for (const m of M.list){ m.x = clamp(m.x, m.r, W - m.r); m.y = clamp(m.y, m.r, H - m.r); show(m); }
  M.contacts=contacts;
  sound?.rolling(M.list.map(m=>{if(m.edgeTick)m.edgeTick.clear();return {id:m.id,material:m.kind.look,weight:m.w,speed:Math.hypot(m.x-m.audioX,m.y-m.audioY)/dt/unit};}));
  PERF.work[PERF.n % PERF.work.length] = performance.now() - w0;
  if (PERF.n && PERF.n % 90 === 0) judge();
  if (M.frozen || !M.list.some(moving)){ M.raf = 0;sound?.end('roll0');sound?.end('roll1');perfSummary();showPerf();changed();return; }
  M.raf = requestAnimationFrame(tick);
}
function judge(){                                      // a device that cannot keep up gets wider step spacing; it never goes back up mid-session
  const n = Math.min(PERF.n, 90), fr = [], wk = []; for (let i = 0; i < n; i++){ const j = (PERF.n - 1 - i) % PERF.ring.length; fr.push(PERF.ring[j]); wk.push(PERF.work[j]); }
  fr.sort((a, b) => a - b); wk.sort((a, b) => a - b); const f95 = fr[Math.floor(.95 * (n - 1))], w95 = wk[Math.floor(.95 * (n - 1))];
  if (n >= 45 && Q.level < Q.gap.length - 1 && (w95 > 9 || f95 > 27)) Q.level++;
}

/* ---------- read-out (lab only): the frame figures are for the last burst of marble movement ---------- */
const PERF = {ring:new Float32Array(1500), work:new Float32Array(1500), n:0, steps:0}, LAST = {splat:'', run:''};
function perfFrame(ms){ if (ms > 0 && ms < 1000) PERF.ring[PERF.n++ % PERF.ring.length] = ms; }
const pct = (arr, n, q) => { const a = Array.from(arr.subarray(0, Math.min(n, arr.length))).sort((x, y) => x - y); return a.length ? a[Math.floor(q * (a.length - 1))] : 0; };
function perfSummary(){ const n = PERF.n; if (n < 5) return; let sum = 0; for (let i = 0; i < Math.min(n, PERF.ring.length); i++) sum += PERF.ring[i];
  LAST.run = `marbles: ${(1000 / (sum / Math.min(n, PERF.ring.length))).toFixed(1)} fps avg  frame p95 ${pct(PERF.ring, n, .95).toFixed(1)} ms  work p95 ${pct(PERF.work, n, .95).toFixed(2)} ms\n         ${PERF.steps} steps in ${n} frames  spacing level ${Q.level}`;
  window.__lab.lastRun = {fps: 1000 / (sum / Math.min(n, PERF.ring.length)), p95: pct(PERF.ring, n, .95), workP95: pct(PERF.work, n, .95), smears: PERF.steps, frames: n, level: Q.level}; }
function showPerf(){if(!document.body.classList.contains('lab'))return;perfEl.textContent = `${paint.width}x${paint.height} dpr ${DPR.toFixed(2)}  patch ${M.P || '-'} px  sheet  turn ${VIEW.r}  zoom x${VIEW.z.toFixed(2)}\n${M.list.map(m => m.kind.name).join(', ') || 'no marbles'}\n${LAST.splat}\n${LAST.run}`.trim(); }

/* ---------- one local draft and deliberate export; never write artwork to the server ---------- */
let studioReady=true,draftTimer=0,draftRevision=0,savedRevision=0,draftWriting=false,draftPromise=null,leaving=false,exportUrl='',exportFile=null,exportEpoch=0;
const draft=window.StudioDraft&&!QS.has('lab')&&!QS.has('demo')&&QS.get('draft')!=='off'?new StudioDraft():null;
function draftNotice(text){const el=$('#draft-status');el.textContent=text;el.hidden=!text;}
function changed(){draftRevision++;scheduleDraft();}
function scheduleDraft(){if(!draft||!studioReady||draft.failed||savedRevision===draftRevision)return;clearTimeout(draftTimer);draftTimer=setTimeout(flushDraft,1000);}
function canvasBlob(canvas){return new Promise((resolve,reject)=>{try{canvas.toBlob(blob=>blob?resolve(blob):reject(Error('Picture unavailable')),'image/png');}catch(e){reject(e);}});}
async function flushDraft(){
  clearTimeout(draftTimer);draftTimer=0;
  if(draftWriting)return draftPromise;
  if(!draft||!studioReady||draft.failed||draftRevision===savedRevision)return;
  if(ptrs.size||M.raf){scheduleDraft();return;}
  draftWriting=true;const revision=draftRevision;
  draftPromise=(async()=>{try{const blank=sheetBlank,blob=await canvasBlob(paint);await draft.write(blob,blank);savedRevision=revision;draftNotice('');}
  catch(_){draft.failed=true;draftNotice('Device saving is unavailable. Use the save arrow to keep your picture.');}
  finally{draftWriting=false;draftPromise=null;if(draftRevision!==savedRevision)scheduleDraft();}})();return draftPromise;
}
async function leaveStudio(url){
  if(leaving)return;leaving=true;sound?.stop();haltMarbles();clearGestures();changed();app.style.pointerEvents='none';
  try{await Promise.race([(async()=>{await flushDraft();if(draftRevision!==savedRevision)await flushDraft();})(),new Promise(r=>setTimeout(r,1800))]);}
  finally{location.href=url;}
}
async function restoreDraft(){
  if(!draft)return;studioReady=false;draftNotice('Opening your picture…');
  try{const record=await draft.read();
    if(record){if(record.version!==1||record.width!==W||record.height!==H||(!(record.blob instanceof Blob)&&!(record.data instanceof ArrayBuffer)))throw Error('Draft not recognised');
      await new Promise((resolve,reject)=>{const image=new Image(),url=URL.createObjectURL(record.blob||new Blob([record.data],{type:'image/png'}));let done=false;
        const finish=error=>{if(done)return;done=true;clearTimeout(timer);URL.revokeObjectURL(url);error?reject(error):resolve();};
        const timer=setTimeout(()=>finish(Error('Draft unavailable')),2500);
        image.onload=()=>{if(done)return;dev();ctx.drawImage(image,0,0);sheetBlank=record.blank===true;finish();};image.onerror=()=>finish(Error('Draft unavailable'));image.src=url;
      });
    }draftNotice('');
  }catch(_){draft.failed=true;draftNotice('Device saving is unavailable. Use the save arrow to keep your picture.');}

}
function closeExport(){exportEpoch++;$('#export-panel').hidden=true;app.removeAttribute('aria-hidden');if(exportUrl){URL.revokeObjectURL(exportUrl);exportUrl='';}exportFile=null;$('#export-image').removeAttribute('src');$('#download-picture').removeAttribute('href');$('#save').focus();}
async function openExport(){
  if(!studioReady)return;sound?.stop();haltMarbles();clearGestures();changed();const epoch=++exportEpoch;
  $('#export-panel').hidden=false;app.setAttribute('aria-hidden','true');$('#export-image').hidden=true;$('#download-picture').hidden=true;$('#share-picture').hidden=true;
  $('#export-note').textContent='Getting your picture ready…';$('#close-export').focus();
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fffdf6';g.fillRect(0,0,W,H);g.drawImage(paint,0,0);
  try{const blob=await canvasBlob(c);if(epoch!==exportEpoch)return;exportUrl=URL.createObjectURL(blob);$('#export-image').src=exportUrl;$('#export-image').hidden=false;$('#download-picture').href=exportUrl;$('#download-picture').hidden=false;
    try{exportFile=new File([blob],'my-painting.png',{type:'image/png'});$('#share-picture').hidden=!(navigator.canShare&&navigator.canShare({files:[exportFile]}));}catch(_){exportFile=null;}
    $('#export-note').textContent='Save your picture, or press and hold the picture to save it. Your artwork stays on this device.';
  }catch(_){if(epoch===exportEpoch)$('#export-note').textContent='The picture could not be prepared. Go back and try again.';}
  finally{c.width=c.height=1;}
}
onPress($('#save'),openExport);onPress($('#close-export'),closeExport);
$('#share-picture').addEventListener('click',()=>{if(exportFile&&navigator.share)navigator.share({files:[exportFile]}).catch(e=>{if(e.name!=='AbortError')$('#export-note').textContent='Use Save picture, or press and hold the picture to save it.';});});
$('#export-panel').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeExport();}else if(e.key==='Tab'){const items=[...$('#export-card').querySelectorAll('button,a')].filter(el=>!el.hidden);const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});

/* ---------- test picture + scripted demo ---------- */
function testPicture(){
  css(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++){ ctx.strokeStyle = COLOURS[(i * 2 + 1) % 16]; ctx.lineWidth = 46 * unit; ctx.beginPath(); const y = H * (.14 + i * .145);
    ctx.moveTo(W * .08, y); ctx.bezierCurveTo(W * .3, y - 60 * unit, W * .6, y + 60 * unit, W * .92, y); ctx.stroke(); }
  const b = S.bucket; S.bucket = COLOURS.slice(0, 8);
  splat(W * .25, H * .3, 1, 0, 0, 900, S.bucket); splat(W * .2, H * .75, .8, -.6, 2300, 0, S.bucket); splat(W * .7, H * .6, -.7, -.7, 1200, 0, S.bucket); splat(W * .8, H * .25, 1, 0, 0, 80, S.bucket);
  S.bucket = b;
}
window.__lab = {MV, makerView, MINE, makerOpen, makerMark, makerPen, makerSave, makerDraw, splat, testPicture, addMarble, putAway, setTool, stampAt, STAMPS, toScreen, toSheet, KINDS, TUNE, M, S, GEO, VIEW, sound, lastRun:null,
  undo,redo,pushUndo,changed,flushDraft,openExport,closeExport,get history(){return {undo:undoStack.length,redo:redoStack.length};},get draftState(){return {ready:studioReady,failed:!!draft?.failed,revision:draftRevision,saved:savedRevision,writing:draftWriting};},
  inked(){ const d = ctx.getImageData(0, 0, W, H).data; let n = 0; for (let i = 3; i < d.length; i += 4 * 97) if (d[i]) n++; return n; },   /* test hook only: never call getImageData in play */
  get paper(){ return {W, H, bw: paint.width, bh: paint.height}; }};
place(); setTool('brush');historyButtons();restoreDraft();
if (QS.has('demo')){ testPicture(); setTool('marbles'); for (let i = 0; i < 3; i++){ const m = addMarble(), a = rnd() * TAU; m.vx = Math.cos(a) * 900 * unit; m.vy = Math.sin(a) * 900 * unit; } wake();
  const t = setInterval(() => { if (!M.raf){ clearInterval(t); document.body.dataset.done = '1'; } }, 100); }
})();
